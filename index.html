<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="数学クエスト">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1526">
<title>数学クエスト｜高校数学 I・A・II・B</title>
<style>
:root{
  --ink:#0E1526; --ink2:#141D33; --line:rgba(126,166,224,.10);
  --paper:#EAF0FF; --dim:#8FA3C8;
  --I:#4FC3F7; --A:#FFB300; --II:#C77DFF; --B:#4ADE80;
  --red:#FF5A5F; --gold:#FFD65A;
  --acc:var(--I);
  --serif:"Hiragino Mincho ProN","YuMincho","Yu Mincho",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  --math:"Times New Roman","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 27px,var(--line) 27px 28px),
    repeating-linear-gradient(90deg,transparent 0 27px,var(--line) 27px 28px),
    radial-gradient(120% 70% at 50% -10%,#1B2745 0%,#0E1526 60%);
  color:var(--paper);font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
}
#hd{
  position:sticky;top:0;z-index:50;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
  background:linear-gradient(#0E1526f2,#0E1526d9);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.hdrow{display:flex;align-items:center;gap:10px}
#back{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);color:var(--paper);font-size:18px;flex:none;display:none}
#hdtitle{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.04em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvbadge{font-family:var(--serif);font-size:12px;color:var(--gold);border:1px solid rgba(255,214,90,.4);
  border-radius:999px;padding:2px 10px;flex:none}
#xpwrap{height:4px;background:rgba(255,255,255,.10);border-radius:9px;margin-top:8px;overflow:hidden}
#xpbar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#FF9E5A);transition:width .5s}
#scr{padding:16px 14px 60px;max-width:560px;margin:0 auto}

h2.sec{font-family:var(--serif);font-size:13px;letter-spacing:.22em;color:var(--dim);
  font-weight:400;margin:22px 0 10px}
h2.sec:first-child{margin-top:4px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;min-height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:var(--paper);font-size:16px;font-family:var(--sans);
  font-weight:600;padding:14px 16px;text-align:center;margin-top:10px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--acc),#ffffff22);border-color:transparent;color:#0A1020}
.btn.ghost{background:transparent}

/* --- ホーム：世界カード --- */
.world{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.10);
  border-radius:18px;padding:0;overflow:hidden;background:rgba(255,255,255,.04);margin-bottom:12px}
.world .wh{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;
  border-left:5px solid var(--wc);background:linear-gradient(90deg,color-mix(in srgb,var(--wc) 16%,transparent),transparent 70%)}
.world .wt{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.06em;color:var(--paper)}
.world .ws{font-size:12px;color:var(--dim);letter-spacing:.05em}
.world .wnum{margin-left:auto;font-family:var(--math);font-size:13px;color:var(--wc)}
.stlist{padding:6px 10px 10px}
.stage{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;
  border:0;border-radius:12px;padding:11px 8px;color:var(--paper);font-family:var(--sans);font-size:15px}
.stage:active{background:rgba(255,255,255,.07)}
.stage .no{font-family:var(--math);font-size:12px;color:var(--dim);width:22px;flex:none;text-align:center}
.stage .nm{flex:1;line-height:1.3}
.stage .nm small{display:block;font-size:11px;color:var(--dim);letter-spacing:.02em;margin-top:2px}
.stars{font-size:12px;color:var(--gold);letter-spacing:1px;flex:none}
.stars .off{color:rgba(255,255,255,.18)}

/* --- まなびスライド --- */
.slide{min-height:56vh}
.slide h3{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.45;
  letter-spacing:.03em;margin-bottom:14px}
.slide h3::before{content:"";display:block;width:34px;height:3px;background:var(--acc);
  border-radius:2px;margin-bottom:12px}
.body p{margin-bottom:12px;line-height:1.95}
.body b{color:var(--acc);font-weight:600}
.eq{font-family:var(--math);font-size:18px;text-align:center;padding:14px 8px;margin:14px 0;
  background:rgba(255,255,255,.05);border-radius:12px;letter-spacing:.02em;line-height:2.6;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.hint{border-left:3px solid var(--red);padding:8px 0 8px 12px;margin:14px 0;font-size:14px;line-height:1.95;
  color:#FFD9DA;font-family:var(--serif);letter-spacing:.02em}
.hint::before{content:"赤ペン ";font-size:11px;color:var(--red);letter-spacing:.14em}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0 4px}
.dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--acc);width:18px}
canvas.fig{width:100%;height:auto;display:block;margin:6px 0 4px;border-radius:12px;
  background:rgba(255,255,255,.04)}

/* --- バトル --- */
.arena{position:relative;text-align:center;padding:4px 0 2px}
#mons{width:150px;height:130px}
.mname{font-family:var(--serif);font-size:13px;color:var(--dim);letter-spacing:.1em}
.hpwrap{height:9px;background:rgba(255,255,255,.10);border-radius:9px;overflow:hidden;margin:6px auto;max-width:240px}
.hpwrap i{display:block;height:100%;background:linear-gradient(90deg,#FF6B6B,#FFB300);transition:width .4s}
.mybar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:10px 0 2px}
.mybar .hpwrap{flex:1;margin:0;max-width:none}
.mybar .hpwrap i{background:linear-gradient(90deg,var(--acc),#7CFFCB)}
.tbar{height:3px;background:rgba(255,255,255,.10);border-radius:9px;overflow:hidden;margin:10px 0 12px}
.tbar i{display:block;height:100%;background:var(--acc);width:100%}
.tbar.warn i{background:var(--red)}
.qmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.1em}
.combo{color:var(--gold)}
.qtext{font-size:17px;line-height:2.1;margin:10px 0 16px;font-weight:500}
.choice{display:block;width:100%;min-height:58px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.055);color:var(--paper);font-family:var(--math);font-size:18px;
  line-height:1.75;word-break:break-word;
  padding:14px 12px;margin-bottom:9px;text-align:center;transition:transform .08s,background .15s}
.choice:active{transform:scale(.985)}
.choice.ok{background:rgba(74,222,128,.22);border-color:#4ADE80}
.choice.ng{background:rgba(255,90,95,.20);border-color:var(--red)}
.choice.dim{opacity:.42}
.verdict{font-family:var(--serif);font-size:18px;letter-spacing:.1em;margin:4px 0 8px}
.verdict.ok{color:#7CFFCB} .verdict.ng{color:var(--red)}
.expl{border-left:3px solid var(--red);padding:2px 0 2px 12px;font-size:14.5px;line-height:2.05;
  color:#FFE3E4;font-family:var(--serif)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pp .35s}
@keyframes pp{50%{transform:scale(1.12)}}

/* --- 結果 --- */
.big{font-family:var(--serif);font-size:30px;letter-spacing:.12em;text-align:center;margin:6px 0}
.bigstars{font-size:34px;text-align:center;color:var(--gold);letter-spacing:6px;margin:6px 0 2px}
.bigstars .off{color:rgba(255,255,255,.16)}
.kv{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed rgba(255,255,255,.12);font-size:14px}
.kv b{font-family:var(--math);font-size:17px;font-weight:400}
.rev{font-size:14px;line-height:2;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.rev .rq{color:var(--paper)} .rev .ra{color:#7CFFCB;font-family:var(--math)}
.rev .re{color:var(--dim);font-family:var(--serif);font-size:13px}

/* --- 統計 --- */
.srow{margin-bottom:11px}
.srow .st{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.srow .st span:last-child{font-family:var(--math);color:var(--dim)}
.sbar{height:7px;background:rgba(255,255,255,.09);border-radius:9px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:9px}

/* --- 数式表示 --- */
/* 上下付き：line-height:0 で行の高さを押し広げないようにする */
sup{font-size:.7em;vertical-align:.45em;line-height:0;position:relative;top:-.06em}
sub{font-size:.7em;vertical-align:-.18em;line-height:0}
/* 分数：inline-block + block子要素にすると Safari でもベースラインが安定する */
.frac{display:inline-block;font-family:var(--math);vertical-align:-.56em;text-align:center;
  margin:0 .22em;line-height:1.12}
.frac>.num{display:block;border-bottom:1px solid currentColor;padding:0 .3em .06em}
.frac>.den{display:block;padding:.06em .3em 0}
.frac .frac{font-size:.84em;vertical-align:-.5em;margin:0 .12em}
/* 根号：√ は独立した文字として置き、上線は中身だけにかける。
   line-height で上線の高さを √ の先端に合わせている（.hi は指数を含む場合） */
.rad{display:inline-block;font-family:var(--math);padding-right:.02em;line-height:1;
     transform:scaleY(1.06);transform-origin:bottom}
.rad.hi{transform:scaleY(1.2)}
.sq{white-space:nowrap}   /* √ と中身が行またぎで分断されないように */
.rad.tall{transform:scaleY(2.25)}
.rt.tall{line-height:1}
.rt{display:inline-block;font-family:var(--math);border-top:1px solid currentColor;line-height:.78;
    padding:0 .17em 0 .07em;margin-left:-.07em}
.rt.hi{line-height:.9}
.rt.hi sup{font-size:.62em;vertical-align:.3em}
.rt .frac{vertical-align:-.5em}
.mth{font-family:var(--math);font-style:normal}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  background:#1B2745;border:1px solid var(--gold);color:var(--gold);font-family:var(--serif);
  padding:10px 20px;border-radius:999px;z-index:99;letter-spacing:.1em;font-size:14px;
  animation:tst 2.2s forwards}
@keyframes tst{0%{opacity:0;transform:translate(-50%,14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="hd">
  <div class="hdrow">
    <button id="back">‹</button>
    <div id="hdtitle">数学クエスト</div>
    <div class="lvbadge" id="lvb">Lv.1</div>
  </div>
  <div id="xpwrap"><div id="xpbar"></div></div>
</div>
<div id="scr"></div>
<script>
/* =========================================================
   数学クエスト  ―  高校数学 I・A・II・B 学習RPG
   単一HTML / 外部ライブラリなし / iPhone Safari 最適化
   ========================================================= */

/* ---------- 汎用ユーティリティ ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const RC=a=>a[Math.floor(Math.random()*a.length)];
const NZ=(a,b)=>{let v=0;while(v===0)v=R(a,b);return v;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b===0?Math.abs(a):gcd(b,a%b);
const num=n=>String(n).replace(/-/g,'−');
const sg=n=>(n<0?' − ':' + ')+Math.abs(n);
const fac=(a,v)=>'('+(v||'x')+sg(a)+')';
const $=s=>document.querySelector(s);
function term(c,v){if(c===0)return'';if(!v)return num(c);if(c===1)return v;if(c===-1)return'−'+v;return num(c)+v;}
function poly(ts){let s='';for(const[c,v]of ts){if(c===0)continue;if(s===''){s+=term(c,v);}else{s+=(c<0?' − ':' + ')+term(Math.abs(c),v);}}return s===''?'0':s;}
function frac(a,b){ // 既約分数の文字列（%f記法）
  if(b<0){a=-a;b=-b;} const g=gcd(Math.abs(a),b)||1; a/=g;b/=g;
  if(b===1)return num(a);
  return (a<0?'−':'')+'%f{'+Math.abs(a)+'}{'+b+'}';
}
function srt(n){ // √n を簡約して文字列に（係数, 中身）
  let o=1,inn=n;
  for(let k=Math.floor(Math.sqrt(n));k>=2;k--){if(n%(k*k)===0){o=k;inn=n/(k*k);break;}}
  if(inn===1)return String(o);
  return (o===1?'':o)+'%s{'+inn+'}';
}
/* 数式マークアップ → HTML  %f{分子}{分母}  %s{中身}  ^{..} _{..} */
function M(s){
  s=String(s);
  for(let i=0;i<6;i++){          // 内側の記法から順に、変化がなくなるまで畳み込む
    const before=s;
    s=s.replace(/%s\{([^{}]*)\}/g,function(m,a){
      // 中身に分数があれば √ を縦に伸ばし、指数があれば上線を少し高くする
      const hi=(/class="frac"/.test(a)?' tall':(/\^|<sup/.test(a)?' hi':''));
      return '<span class="sq"><span class="rad'+hi+'">√</span><span class="rt'+hi+'">'+a+'</span></span>';});
    s=s.replace(/%f\{([^{}]*)\}\{([^{}]*)\}/g,'<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
    s=s.replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>');
    s=s.replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>');
    if(s===before)break;
  }
  s=s.replace(/\^(-?[0-9a-zA-Z])/g,'<sup>$1</sup>');
  s=s.replace(/_([0-9a-zA-Z])/g,'<sub>$1</sub>');
  return s;
}
function Q(q,c,w,ex,draw){return{q:q,c:String(c),w:w.map(String),ex:ex,draw:draw||null};}

/* ---------- 効果音（Web Audio） ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(freq,dur,type,vol,delay){
  const c=ac();if(!c)return;
  const t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'triangle';o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.14,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  tap:()=>beep(520,.06,'square',.05),
  ok:()=>{beep(660,.11,'triangle',.13,0);beep(880,.11,'triangle',.13,.07);beep(1320,.22,'triangle',.11,.14);},
  ng:()=>{beep(200,.20,'sawtooth',.10,0);beep(140,.28,'sawtooth',.09,.09);},
  hit:()=>beep(90,.16,'square',.10),
  lv:()=>{[523,659,784,1046].forEach((f,i)=>beep(f,.24,'triangle',.13,i*.09));},
  win:()=>{[523,659,784,1046,1318].forEach((f,i)=>beep(f,.3,'triangle',.12,i*.11));},
  lose:()=>{[440,392,330,262].forEach((f,i)=>beep(f,.3,'sine',.11,i*.13));}
};

/* ---------- セーブなしの進行状態（メモリ内） ---------- */
const S={xp:0,lv:1,totalXP:0,stars:{},stat:{},view:'home',unit:null};
const xpNeed=lv=>80+(lv-1)*55;
function addXP(n){
  S.xp+=n;S.totalXP+=n;let up=false;
  while(S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;up=true;}
  paintHd();return up;
}
function paintHd(){
  $('#lvb').textContent='Lv.'+S.lv;
  $('#xpbar').style.width=Math.min(100,S.xp/xpNeed(S.lv)*100)+'%';
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2300);}

/* ---------- 図版（Canvas） ---------- */
const CO={I:'#4FC3F7',A:'#FFB300',II:'#C77DFF',B:'#4ADE80',III:'#FF8A80',C:'#2DD4BF'};
function mkCanvas(host,w,h){
  const c=document.createElement('canvas');c.className='fig';
  const d=Math.min(window.devicePixelRatio||1,2);
  c.width=w*d;c.height=h*d;c.style.aspectRatio=w+'/'+h;
  host.appendChild(c);const x=c.getContext('2d');x.scale(d,d);
  x.lineJoin='round';x.lineCap='round';return x;
}
function grid(x,w,h,X,Y){
  x.clearRect(0,0,w,h);
  x.strokeStyle='rgba(126,166,224,.16)';x.lineWidth=1;
  for(let i=Math.ceil(X.min);i<=X.max;i++){x.beginPath();x.moveTo(X.p(i),0);x.lineTo(X.p(i),h);x.stroke();}
  for(let i=Math.ceil(Y.min);i<=Y.max;i++){x.beginPath();x.moveTo(0,Y.p(i));x.lineTo(w,Y.p(i));x.stroke();}
  x.strokeStyle='rgba(234,240,255,.55)';x.lineWidth=1.4;
  x.beginPath();x.moveTo(0,Y.p(0));x.lineTo(w,Y.p(0));x.stroke();
  x.beginPath();x.moveTo(X.p(0),0);x.lineTo(X.p(0),h);x.stroke();
}
function scale(min,max,px0,px1){return{min:min,max:max,p:v=>px0+(v-min)/(max-min)*(px1-px0)};}
function plot(x,f,X,Y,col,wd){
  x.strokeStyle=col;x.lineWidth=wd||2.4;x.beginPath();let st=false;
  for(let px=0;px<=1;px+=1/240){
    const vx=X.min+(X.max-X.min)*px,vy=f(vx);
    if(!isFinite(vy)||vy<Y.min-40||vy>Y.max+40){st=false;continue;}
    if(!st){x.moveTo(X.p(vx),Y.p(vy));st=true;}else x.lineTo(X.p(vx),Y.p(vy));
  }
  x.stroke();
}
function dot(x,X,Y,vx,vy,col,r){x.fillStyle=col;x.beginPath();x.arc(X.p(vx),Y.p(vy),r||4,0,7);x.fill();}
function lab(x,t,px,py,col,size,align){x.fillStyle=col||'#8FA3C8';x.font=(size||12)+'px "Times New Roman",serif';
  x.textAlign=align||'center';x.textBaseline='middle';x.fillText(t,px,py);}

const FIG={
  parabola(host,c){const x=mkCanvas(host,320,210),X=scale(-3,5,14,306),Y=scale(-5,5,196,14);
    grid(x,320,210,X,Y);plot(x,t=>t*t-2*t-3,X,Y,c);
    dot(x,X,Y,1,-4,'#FF5A5F',5);lab(x,'頂点(1,−4)',X.p(1)+6,Y.p(-4)+16,'#FF5A5F',11,'left');
    dot(x,X,Y,-1,0,c,4);dot(x,X,Y,3,0,c,4);
    lab(x,'y = x²−2x−3',300,20,c,13,'right');},
  righttri(host,c){const x=mkCanvas(host,320,200);
    x.strokeStyle=c;x.lineWidth=2.4;x.beginPath();x.moveTo(50,165);x.lineTo(250,165);x.lineTo(250,55);x.closePath();x.stroke();
    x.strokeStyle='rgba(234,240,255,.5)';x.lineWidth=1.4;x.strokeRect(232,147,18,18);
    x.strokeStyle='#FFB300';x.beginPath();x.arc(50,165,34,-0.5,0);x.stroke();
    lab(x,'θ',94,152,'#FFB300',15,'left');
    lab(x,'底辺（隣辺）',150,180,'#8FA3C8',12);lab(x,'高さ（対辺）',258,110,'#8FA3C8',12,'left');
    lab(x,'斜辺',140,100,'#8FA3C8',12);

slides:[
 {t:'平方完成すれば頂点が見える',h:`
  <p>2次関数のすべては<b>頂点</b>から始まります。y = a(x − p)^2 + q の形に直せば、頂点は (p, q)。</p>
  <div class="eq">y = x^2 − 2x − 3<br>= (x − 1)^2 − 1 − 3<br>= (x − 1)^2 − 4</div>
  <p>手順は「xの係数の<b>半分</b>を作って、その<b>2乗を引く</b>」だけ。</p>`,fig:'parabola'},
 {t:'最大・最小は頂点か端っこ',h:`
  <p>a &gt; 0（下に凸）なら頂点で<b>最小</b>、a &lt; 0（上に凸）なら頂点で<b>最大</b>。</p>
  <p>範囲が指定されているときは要注意。頂点が範囲の外にあれば、<b>端の値</b>が答えになります。</p>
  <div class="hint">「頂点が範囲に入っているか」を必ず確認。ここを飛ばすと定期試験で必ず落とします。</div>`},
 {t:'判別式 D で交点の個数がわかる',h:`
  <p>ax^2 + bx + c = 0 の解の個数は D = b^2 − 4ac の符号で決まります。</p>
  <div class="eq">D &gt; 0 → 共有点は2個<br>D = 0 → 1個（接する）<br>D &lt; 0 → 0個</div>
  <p>グラフで言えば、放物線が x 軸と何回交わるか。計算せずに形がわかる便利な道具です。</p>`},
 {t:'2次不等式はグラフで読む',h:`
  <p>(x − 2)(x − 5) &lt; 0 の解は 2 &lt; x &lt; 5。下に凸の放物線で、<b>x軸より下</b>にある部分です。</p>
  <div class="eq">(x − α)(x − β) &lt; 0 → α &lt; x &lt; β<br>(x − α)(x − β) &gt; 0 → x &lt; α, β &lt; x</div>
  <div class="hint">「小なり」は<b>あいだ</b>、「大なり」は<b>そとがわ</b>。放物線の絵を1本描けば絶対に間違えません。</div>`}
],
gens:[
 function(){const p=NZ(-4,4),q=NZ(-8,8),b=-2*p,c=p*p+q;
  return Q('次の2次関数の頂点の座標は？<div class="eq">y = '+poly([[1,'x^2'],[b,'x'],[c,'']])+'</div>',
   '('+num(p)+', '+num(q)+')',['('+num(-p)+', '+num(q)+')','('+num(p)+', '+num(-q)+')','('+num(b)+', '+num(c)+')'],
   '平方完成すると y = (x '+sg(-p)+')^2 '+sg(q)+'。よって頂点は ('+num(p)+', '+num(q)+')。');},
 function(){const b=NZ(-6,6),c=NZ(-6,8),D=b*b-4*c;
  const ans=D>0?'2個':(D===0?'1個':'0個');
  return Q('放物線 y = '+poly([[1,'x^2'],[b,'x'],[c,'']])+' と x 軸の共有点は何個？',
   ans,['2個','1個','0個','無数にある'].filter(v=>v!==ans),
   'D = b^2 − 4ac = ('+num(b)+')^2 − 4×1×('+num(c)+') = '+num(D)+'。D '+(D>0?'&gt; 0 なので2個':(D===0?'= 0 なので接して1個':'&lt; 0 なので共有点なし'))+'。');},
 function(){let p=R(-5,3),q=p+R(1,5);const lt=Math.random()<.5;
  const ex=poly([[1,'x^2'],[-(p+q),'x'],[p*q,'']])+(lt?' &lt; 0':' &gt; 0');
  const c=lt?(num(p)+' &lt; x &lt; '+num(q)):('x &lt; '+num(p)+', '+num(q)+' &lt; x');
  return Q('次の2次不等式を解こう。<div class="eq">'+ex+'</div>',c,
   [lt?('x &lt; '+num(p)+', '+num(q)+' &lt; x'):(num(p)+' &lt; x &lt; '+num(q)),
    'x &lt; '+num(q),num(q)+' &lt; x &lt; '+num(p+q)],
   '因数分解すると '+fac(-p)+fac(-q)+(lt?' &lt; 0':' &gt; 0')+'。'+
   (lt?'「小なり」なので2解の<b>あいだ</b>。':'「大なり」なので2解の<b>そとがわ</b>。'));},
 function(){const a=NZ(-6,6),b=NZ(-6,6);
  return Q('次の2次方程式を解こう。<div class="eq">'+poly([[1,'x^2'],[-(a+b),'x'],[a*b,'']])+' = 0</div>',
   'x = '+num(a)+', '+num(b),['x = '+num(-a)+', '+num(-b),'x = '+num(a)+', '+num(-b),'x = '+num(a+b)+', '+num(a*b)],
   '因数分解して '+fac(-a)+fac(-b)+' = 0。よって x = '+num(a)+', '+num(b)+'。');},
 function(){const p=NZ(-3,3),q=NZ(-6,6),up=Math.random()<.5,a=up?RC([1,2]):RC([-1,-2]);
  const f=[[a,'x^2'],[-2*a*p,'x'],[a*p*p+q,'']];
  return Q('次の2次関数の'+(up?'最小値':'最大値')+'は？<div class="eq">y = '+poly(f)+'</div>',
   num(q),[num(-q),num(p),num(q+a),num(q-a)],
   '平方完成すると y = '+num(a)+'(x '+sg(-p)+')^2 '+sg(q)+'。a '+(up?'&gt; 0 なので下に凸、頂点で最小':'&lt; 0 なので上に凸、頂点で最大')+'。値は '+num(q)+'。');},
 function(){const a=NZ(-7,7),b=NZ(-7,7),S=a+b,P=a*b;
  const k=RC(['和','積']);
  return Q('2次方程式 '+poly([[1,'x^2'],[-S,'x'],[P,'']])+' = 0 の2つの解の'+k+'は？',
   num(k==='和'?S:P),[num(k==='和'?P:S),num(-(k==='和'?S:P)),num((k==='和'?S:P)+1)],
   '解と係数の関係より、和 = −b/a = '+num(S)+'、積 = c/a = '+num(P)+'。展開せずに読み取れる。');}
]});

UNITS.push({k:'I',n:'図形と計量',s:'三角比・正弦定理・余弦定理・空間の計量',boss:'θ',
slides:[
 {t:'三角比は「辺の比」',h:`
  <p>直角三角形で角 θ を決めると、3辺の比が決まります。それが sin・cos・tan。</p>
  <p>合言葉は<b>「サイン・コサイン・タンジェント」の筆記体</b>。s は分母が斜辺から、c は分母が斜辺から、t は分母が底辺から書き始める。</p>`,fig:'righttri'},
 {t:'覚える値は3つの三角定規だけ',h:`
  <div class="eq">θ = 30°&nbsp; sin %f{1}{2}&nbsp; cos %f{%s{3}}{2}&nbsp; tan %f{1}{%s{3}}<br>
  θ = 45°&nbsp; sin %f{1}{%s{2}}&nbsp; cos %f{1}{%s{2}}&nbsp; tan 1<br>
  θ = 60°&nbsp; sin %f{%s{3}}{2}&nbsp; cos %f{1}{2}&nbsp; tan %s{3}</div>
  <p>90°を超える角は<b>符号が変わる</b>だけ。sin120° = sin60°、cos120° = −cos60° です。</p>
  <div class="hint">丸暗記より「1:2:√3 の三角定規」を頭に描いて毎回作る方が速く正確。</div>`},
 {t:'正弦定理：角と対辺をつなぐ',h:`
  <div class="eq">%f{a}{sinA} = %f{b}{sinB} = %f{c}{sinC} = 2R</div>
  <p>「<b>角とその向かい合う辺</b>」がセットで出てきたら正弦定理。外接円の半径 R も同時に求まります。</p>`},
 {t:'余弦定理：2辺と挟む角',h:`
  <div class="eq">a^2 = b^2 + c^2 − 2bc·cosA</div>
  <p>三平方の定理に補正項 −2bc cosA がついた形。A = 90° なら cosA = 0 で三平方の定理そのものになります。</p>
  <p>面積の公式も一緒に。</p>
  <div class="eq">S = %f{1}{2}·ab·sinC</div>`,fig:'triabc'}
],
gens:[
 function(){const T=[['sin30°','%f{1}{2}'],['cos60°','%f{1}{2}'],['tan45°','1'],['sin60°','%f{%s{3}}{2}'],
   ['cos30°','%f{%s{3}}{2}'],['tan60°','%s{3}'],['sin90°','1'],['cos90°','0'],
   ['sin120°','%f{%s{3}}{2}'],['cos120°','−%f{1}{2}'],['sin150°','%f{1}{2}'],['cos180°','−1']];
  const t=RC(T);
  return Q('次の値を求めよう。<div class="eq">'+t[0]+'</div>',t[1],
   ['%f{1}{2}','%f{%s{3}}{2}','%f{1}{%s{2}}','1','0','−%f{1}{2}','%s{3}','−1'].filter(v=>v!==t[1]).slice(0,4),
   '三角定規（1:2:%s{3} と 1:1:%s{2}）から読み取る。120°以上は 180°−θ を使い、cos は符号が負になる。');},
 function(){const b=R(3,8),c=R(3,8),A=RC([60,120]);
  const a2=b*b+c*c-(A===60?b*c:-b*c);
  return Q('△ABC で b = '+b+', c = '+c+', A = '+A+'° のとき a^2 は？',
   String(a2),[String(b*b+c*c),String(b*b+c*c+(A===60?b*c:-b*c)),String(b*b+c*c-2*b*c)],
   'a^2 = b^2 + c^2 − 2bc cosA = '+(b*b)+' + '+(c*c)+' − 2×'+b+'×'+c+'×('+(A===60?'%f{1}{2}':'−%f{1}{2}')+') = '+a2+'。');},
 function(){const a=R(2,9),A=RC([30,150]);
  return Q('△ABC で a = '+a+', A = '+A+'° のとき外接円の半径 R は？',
   String(a),[String(a/2),String(2*a),String(a*2/3)],
   '正弦定理より a/sinA = 2R。sin'+A+'° = %f{1}{2} なので 2R = '+a+' ÷ %f{1}{2} = '+(2*a)+'。よって R = '+a+'。');},
 function(){const a=R(2,9),b=R(2,9),C=RC([30,150]);const S=a*b/4;
  return Q('△ABC で a = '+a+', b = '+b+', C = '+C+'° のとき面積 S は？',
   (Number.isInteger(S)?String(S):frac(a*b,4)),[frac(a*b,2),String(a*b),frac(a*b,8)],
   'S = %f{1}{2}ab sinC = %f{1}{2}×'+a+'×'+b+'×%f{1}{2} = '+(Number.isInteger(S)?S:frac(a*b,4))+'。sin'+C+'° = %f{1}{2}。');},
 function(){const T=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]],t=RC(T);
  const which=RC(['cos','tan']);
  return Q('θ は鋭角で sinθ = %f{'+t[0]+'}{'+t[2]+'} のとき、'+which+'θ は？',
   which==='cos'?frac(t[1],t[2]):frac(t[0],t[1]),
   [which==='cos'?frac(t[0],t[1]):frac(t[1],t[2]),frac(t[2],t[1]),frac(t[1],t[0])],
   'sin^2θ + cos^2θ = 1 より cosθ = %f{'+t[1]+'}{'+t[2]+'}（鋭角なので正）。tanθ = sinθ/cosθ = %f{'+t[0]+'}{'+t[1]+'}。');},
 function(){const a=R(2,9);
  return Q('1辺の長さが '+a+' の立方体の対角線の長さは？',
   a+'%s{3}',[a+'%s{2}',String(a*3),(a*2)+'%s{3}'],
   '対角線 = %s{a^2+a^2+a^2} = a%s{3}。1辺 '+a+' なので '+a+'%s{3}。');}
]});

UNITS.push({k:'I',n:'データの分析',s:'四分位数・分散・相関係数・仮説検定の考え',boss:'σ',
slides:[
 {t:'代表値：平均と中央値の違い',h:`
  <p>平均値はすべての値の影響を受けるので、<b>極端な値に引っ張られます</b>。中央値は真ん中の順位の値なので影響を受けにくい。</p>
  <p>年収や住宅価格で「平均より中央値」と言われるのはこのためです。</p>
  <div class="hint">データが偶数個なら、中央2つの<b>平均</b>が中央値。数え間違いに注意。</div>`},
 {t:'四分位数と箱ひげ図',h:`
  <p>データを小さい順に並べて4等分する位置が Q1・Q2（中央値）・Q3。<b>四分位範囲 = Q3 − Q1</b> で、真ん中50%の散らばりを表します。</p>`,fig:'box'},
 {t:'分散と標準偏差',h:`
  <p>各データが平均からどれだけ離れているか。<b>偏差を2乗して平均</b>したものが分散、そのルートが標準偏差です。</p>
  <div class="eq">s^2 = %f{1}{n}Σ(x_i − x̄)^2&nbsp;&nbsp;&nbsp; s = %s{s^2}</div>
  <p>2乗するのは、プラスとマイナスの偏差が打ち消し合わないようにするため。標準偏差は<b>元のデータと同じ単位</b>に戻す作業です。</p>`},
 {t:'相関係数は −1 から 1 のあいだ',h:`
  <p>2つの量の直線的な関係の強さ。1 に近いほど右上がり、−1 に近いほど右下がり、0 に近いと関係が薄い。</p>
  <div class="hint"><b>相関があっても因果があるとは限りません。</b>アイスの売上と水難事故は相関しますが、原因はどちらも「気温」です。</div>`},
 {t:'仮説検定の考え方',h:`
  <p>「たまたまかも」を数字で判定します。まず<b>「差はない」（帰無仮説）</b>と仮定して、観測されたことが起こる確率を計算。</p>
  <p>その確率が基準（ふつう 5%）より小さければ「たまたまとは考えにくい」＝<b>仮説を棄却</b>します。</p>
  <div class="eq">確率 &lt; 0.05 → 棄却する<br>確率 ≧ 0.05 → 棄却できない</div>`}
],
gens:[
 function(){const n=5,d=RC([[-2,-1,0,1,2],[-4,-2,0,2,4],[-3,-1,0,1,3]]),m=R(5,15);
  const data=shuffle(d.map(v=>v+m)),V=d.reduce((s,v)=>s+v*v,0)/n;
  return Q('次のデータの分散は？<div class="eq">'+data.join(', ')+'</div>',
   String(V),[String(V*2),String(m),String(Math.round(Math.sqrt(V)*10)/10)],
   '平均は '+m+'。偏差は '+d.slice().sort((a,b)=>a-b).join(', ')+' で、2乗の平均は '+V+'。');},
 function(){const n=RC([7,9]),data=[];for(let i=0;i<n;i++)data.push(R(1,40));
  const s=data.slice().sort((a,b)=>a-b),med=s[(n-1)/2];
  return Q('次のデータの中央値は？<div class="eq">'+data.join(', ')+'</div>',
   String(med),[String(s[0]),String(s[n-1]),String(Math.round(data.reduce((x,y)=>x+y,0)/n))],
   '小さい順に並べると '+s.join(', ')+'。'+n+'個なので '+((n+1)/2)+'番目の '+med+' が中央値。');},
 function(){const s=[];for(let i=0;i<8;i++)s.push(R(1,50));s.sort((a,b)=>a-b);
  const q1=(s[1]+s[2])/2,q3=(s[5]+s[6])/2,iqr=q3-q1;
  return Q('小さい順に並べたデータ<div class="eq">'+s.join(', ')+'</div>の四分位範囲は？',
   String(iqr),[String(q1),String(q3),String(s[7]-s[0])],
   '下位4個の中央値 Q1 = '+q1+'、上位4個の中央値 Q3 = '+q3+'。四分位範囲 = Q3 − Q1 = '+iqr+'。');},
 function(){const tgt=RC([1,-1,0]),pts=[];
  for(let i=0;i<14;i++){const x=R(1,9)+Math.random();
    const y=tgt===0?R(1,9)+Math.random():5+tgt*(x-5)*1.1+(Math.random()-.5)*1.6;pts.push([x,y]);}
  const mx=pts.reduce((s,p)=>s+p[0],0)/14,my=pts.reduce((s,p)=>s+p[1],0)/14;
  let sxy=0,sx=0,sy=0;pts.forEach(p=>{sxy+=(p[0]-mx)*(p[1]-my);sx+=(p[0]-mx)**2;sy+=(p[1]-my)**2;});
  const r=sxy/Math.sqrt(sx*sy),c=r>0.6?'0.9':(r<-0.6?'−0.9':'0.0');
  return Q('この散布図の相関係数に最も近い値は？',c,['0.9','0.4','−0.9','0.0'].filter(v=>v!==c),
   '実際の相関係数はおよそ '+(Math.round(r*100)/100)+'。'+(r>0.6?'右上がりに集まっているので強い正の相関。':(r<-0.6?'右下がりに集まっているので強い負の相関。':'ばらばらなので相関はほとんどない。')),
   function(host){const x=mkCanvas(host,300,190),X=scale(0,11,26,290),Y=scale(0,11,170,14);
     grid(x,300,190,X,Y);pts.forEach(p=>dot(x,X,Y,p[0],p[1],'#4FC3F7',4.5));});},
 function(){const p=RC([0.012,0.031,0.048,0.072,0.11,0.006]),ans=p<0.05?'棄却できる（偶然とは考えにくい）':'棄却できない（偶然の範囲）';
  return Q('ある主張を検証したところ、「差がない」と仮定したときに観測された結果が起こる確率は '+p+' だった。<br>有意水準 5% で帰無仮説は？',
   ans,['棄却できる（偶然とは考えにくい）','棄却できない（偶然の範囲）','データが足りず判定できない','有意水準を上げれば棄却できる'].filter(v=>v!==ans),
   p+' は 0.05 '+(p<0.05?'より小さい':'以上')+'。よって'+(p<0.05?'めったに起きないことが起きた＝仮説を棄却する。':'ありえない話ではないので棄却できない。')+'棄却できない＝「差がない」と証明されたわけではない点に注意。');},
 function(){const a=R(2,6),data=[a,a+2,a+4,a+6,a+8],m=a+4;
  return Q('次のデータ全体に 10 を加えると、平均値と標準偏差はどうなる？<div class="eq">'+data.join(', ')+'</div>',
   '平均は 10 増え、標準偏差は変わらない',
   ['平均も標準偏差も 10 増える','平均は変わらず標準偏差が 10 増える','平均は 10 増え、標準偏差は 10 倍になる'],
   '全体を平行移動しても<b>散らばり方</b>は変わらないので標準偏差は不変。平均だけ 10 増えて '+(m+10)+' になる。');}
]});

/* ============ 数学 A ============ */
UNITS.push({k:'A',n:'場合の数と確率',s:'順列・組合せ・余事象・条件付き確率',boss:'C',
slides:[
 {t:'並べるか、選ぶか',h:`
  <p>これだけ決めれば半分終わりです。<b>順番が意味を持つなら順列 P、持たないなら組合せ C</b>。</p>
  <div class="eq">_nP_r = n(n−1)…(n−r+1)<br>_nC_r = %f{_nP_r}{r!}</div>
  <p>「委員長と副委員長を選ぶ」は順列、「代表2人を選ぶ」は組合せ。C は P を r! で割って、並べ方の重複を消しています。</p>`},
 {t:'確率＝ありがたい場合 ÷ すべての場合',h:`
  <div class="eq">P(A) = %f{n(A)}{n(U)}</div>
  <p>大切なのは分母と分子を<b>同じ数え方</b>で数えること。分母を組合せで数えたら分子も組合せで数えます。</p>
  <div class="hint">サイコロ2個は「同じ目でも区別する」と考えて全 36 通り。区別しないと確率がずれます。</div>`},
 {t:'「少なくとも」は余事象',h:`
  <p>「少なくとも1回は当たる」を正面から数えると場合分けが爆発します。反対を数えて 1 から引く。</p>
  <div class="eq">P(少なくとも1回)<br>= 1 − P(1回も起きない)</div>
  <p>コインを5回投げて少なくとも1回表が出る確率は 1 − (1/2)^5 = 31/32。</p>`},
 {t:'反復試行と条件付き確率',h:`
  <p>同じ試行を n 回くり返して、確率 p のことが k 回起きる確率。</p>
  <div class="eq">_nC_k · p^k · (1−p)^{n−k}</div>
  <p>条件付き確率は「すでに分かっている情報で<b>世界を狭める</b>」こと。</p>
  <div class="eq">P_A(B) = %f{P(A∩B)}{P(A)}</div>`}
],
gens:[
 function(){const n=R(5,8),r=R(2,3),P=RC(['P','C']);
  let v=1;for(let i=0;i<r;i++)v*=(n-i);let f=1;for(let i=1;i<=r;i++)f*=i;
  const val=P==='P'?v:v/f;
  return Q((P==='P'?n+'人から'+r+'人を選んで<b>1列に並べる</b>方法は何通り？':n+'人から'+r+'人を<b>選ぶ</b>方法は何通り？'),
   val+'通り',[(P==='P'?v/f:v)+'通り',(n*r)+'通り',Math.pow(n,r)+'通り'],

UNITS.push({k:'II',n:'式と証明・複素数',s:'二項定理・剰余の定理・複素数・高次方程式',boss:'i',

UNITS.push({k:'II',n:'指数関数・対数関数',s:'指数法則・対数の計算・常用対数',boss:'log',
slides:[
 {t:'指数を分数・負にひろげる',h:`
  <div class="eq">a^{−n} = %f{1}{a^n}&nbsp;&nbsp; a^{%f{1}{n}} = ⁿ%s{a}&nbsp;&nbsp; a^0 = 1</div>
  <p>拡張しても法則は同じ。<b>かけたら足す、割ったら引く、累乗はかける</b>。</p>

UNITS.push({k:'II',n:'微分・積分の考え',s:'微分係数・増減表と極値・定積分と面積',boss:'∫',
slides:[
 {t:'微分は「接線の傾き」',h:`
  <p>グラフのある点でのなめらかな傾きが微分係数。関数として表したものが導関数です。</p>
  <div class="eq">(x^n)' = n x^{n−1}&nbsp;&nbsp;(定数)' = 0</div>
  <p>「指数を前に下ろして、指数を1減らす」だけ。f(x) = x^3 − 3x^2 なら f'(x) = 3x^2 − 6x。</p>`},
 {t:'増減表で山と谷を探す',h:`
  <p>f'(x) = 0 となる x が、山（極大）か谷（極小）の候補。その前後で f'(x) の<b>符号がどう変わるか</b>を調べます。</p>
  <div class="eq">f' が + → − ： 極大<br>f' が − → + ： 極小</div>
  <div class="hint">f'(x) = 0 でも極値とは限りません（y = x³ の x = 0 が反例）。符号の変化を必ず確認。</div>`},
 {t:'積分は微分の逆',h:`
  <div class="eq">∫x^n dx = %f{1}{n+1}x^{n+1} + C</div>
  <p>微分で「下ろして減らす」なら、積分は「<b>増やして割る</b>」。不定積分には積分定数 C を必ずつけます。</p>`},
 {t:'定積分は面積',h:`
  <div class="eq">∫_a^b f(x)dx = F(b) − F(a)</div>
  <p>f(x) ≧ 0 の範囲では、これがそのまま x 軸との間の<b>面積</b>になります。2曲線に挟まれた面積は（上の式）−（下の式）を積分。</p>`,fig:'integral'}
],
gens:[
 function(){const a=RC([1,2,3]),b=NZ(-5,5),c=NZ(-6,6);

   [poly([[3*a,'x^2'],[b,'x'],[c,'']]),poly([[a,'x^2'],[b,'x'],[c,'']]),poly([[3*a,'x^2'],[2*b,'x'],[0,'']])],
   '各項で「指数を前に下ろして 1 減らす」。'+(3*a)+'x^2 '+sg(2*b)+'x '+sg(c)+'。定数項があれば 0 になる。');},
 function(){const b=NZ(-4,4),c=NZ(-6,6),k=NZ(-3,3);
  const d=3*k*k+2*b*k+c;
  return Q('f(x) = '+poly([[1,'x^3'],[b,'x^2'],[c,'x']])+' の x = '+num(k)+' における接線の傾きは？',
   num(d),[num(-d),num(k*k*k+b*k*k+c*k),num(d+k)],
   'f\'(x) = '+poly([[3,'x^2'],[2*b,'x'],[c,'']])+'。x = '+num(k)+' を代入して '+num(d)+'。接線の傾き = 微分係数。');},
 function(){let r=NZ(-4,4),s=NZ(-4,4);while(s===r)s=NZ(-4,4);
  const lo=Math.min(r,s),hi=Math.max(r,s);
  const b=-3*(r+s)/2*1,B=-(3*(r+s))/2;
  const p=-3*(r+s)/2, q=3*r*s;
  const fx=poly([[1,'x^3'],[p,'x^2'],[q,'x']]);
  return Q('f(x) = '+fx+' が<b>極大</b>となる x の値は？（f\'(x) = 3(x '+sg(-r)+')(x '+sg(-s)+')）',
   num(lo),[num(hi),num(lo+hi),'0'],
   'f\'(x) = 0 より x = '+num(lo)+', '+num(hi)+'。x^3 の係数が正なので、小さい方の x = '+num(lo)+' で + から − に変わり極大になる。');},
 function(){const a=RC([2,4,6,8]),b=NZ(-5,5);
  return Q('不定積分を求めよう。<div class="eq">∫ ('+poly([[a,'x'],[b,'']])+') dx</div>',
   (a/2===Math.round(a/2)?poly([[a/2,'x^2'],[b,'x']]):'%f{'+a+'}{2}x^2 '+sg(b)+'x')+' + C',
   [poly([[a,'x^2'],[b,'x']])+' + C',poly([[a/2,'x^2'],[b,'']])+' + C','a x^2 + C'],
   '∫x dx = %f{1}{2}x^2、∫dx = x。よって '+(a/2)+'x^2 '+sg(b)+'x + C。<b>積分定数 C を忘れない</b>。');},
 function(){const a=R(1,4),c=RC([3,6]);
  const F=t=>c*t*t*t/3;

   '原始関数は %f{'+c+'}{3}x^3 = '+(c/3)+'x^3。'+(c/3)+'×'+a+'^3 − 0 = '+v+'。');},

   '交点は x = 0, '+a+'。面積 = ∫_0^'+a+'('+a+'x − x^2)dx = '+(Number.isInteger(S)?S:frac(a*a*a,6))+'。'+
   '（1/6公式：%f{1}{6}(β−α)^3 = %f{'+(a*a*a)+'}{6}）');}
]});

UNITS.push({k:'B',n:'数列',s:'等差・等比・Σ・漸化式・数学的帰納法',boss:'Σ',

 {t:'等差数列：一定の差で進む',h:`
  <p>初項 a、公差 d の数列。第 n 項と、初項から第 n 項までの和は次の通り。</p>
  <div class="eq">a_n = a + (n − 1)d<br>S_n = %f{n}{2}(a + a_n) = %f{n}{2}{2a + (n−1)d}</div>
  <p>和の公式は「<b>(最初 + 最後) × 個数 ÷ 2</b>」。台形の面積と同じ形です。</p>`,fig:'seq'},

 {t:'Σ の公式',h:`
  <div class="eq">Σ_{k=1}^{n} k = %f{n(n+1)}{2}<br>Σ_{k=1}^{n} k^2 = %f{n(n+1)(2n+1)}{6}<br>Σ_{k=1}^{n} c = nc</div>
  <p>Σ は「順番に足す」という記号にすぎません。Σ(2k + 3) のような式は、<b>バラして</b>それぞれの公式を当てはめます。</p>`},
 {t:'漸化式と数学的帰納法',h:`
  <p>a_{n+1} = 2a_n + 3 のように、前の項から次の項を作る式が漸化式。まずは <b>n = 1, 2, 3 と実際に書き出す</b>のが理解の近道です。</p>
  <p>数学的帰納法は2段構え。<b>(1) n = 1 で成り立つ (2) n = k で成り立つと仮定すると n = k+1 でも成り立つ</b>。この2つでドミノが全部倒れます。</p>`}
],
gens:[
 function(){const a=NZ(-8,12),d=NZ(-6,7),n=R(6,20);
  const an=a+(n-1)*d;
  return Q('初項 '+num(a)+'、公差 '+num(d)+' の等差数列の第 '+n+' 項は？',
   num(an),[num(a+n*d),num(d+(n-1)*a),num(a*n)],
   'a_n = a + (n−1)d = '+num(a)+' + ('+n+'−1)×'+num(d)+' = '+num(an)+'。<b>(n−1) 倍</b>である点に注意。');},
 function(){const a=R(1,9),d=R(1,6),n=R(5,15);
  const S=n*(2*a+(n-1)*d)/2;
  return Q('初項 '+a+'、公差 '+d+' の等差数列の初項から第 '+n+' 項までの和は？',
   String(S),[String(S+n),String(a+(n-1)*d),String(n*a)],
   '末項は '+(a+(n-1)*d)+'。S = %f{'+n+'}{2}('+a+' + '+(a+(n-1)*d)+') = '+S+'。（最初+最後）×個数÷2。');},
 function(){const a=R(1,5),r=RC([2,3]),n=R(4,7);
  const an=a*Math.pow(r,n-1);
  return Q('初項 '+a+'、公比 '+r+' の等比数列の第 '+n+' 項は？',
   String(an),[String(a*Math.pow(r,n)),String(a*r*n),String(a*Math.pow(r,n-2))],
   'a_n = ar^{n−1} = '+a+'×'+r+'^'+(n-1)+' = '+an+'。指数は n ではなく <b>n−1</b>。');},
 function(){const n=R(5,20),k=RC(['k','k^2']);
  const v=k==='k'?n*(n+1)/2:n*(n+1)*(2*n+1)/6;
  return Q('次の値を求めよう。<div class="eq">Σ_{k=1}^{'+n+'} '+k+'</div>',
   String(v),[String(n*n),String(v*2),String(n*(n+1))],
   (k==='k'?'%f{n(n+1)}{2} = %f{'+n+'×'+(n+1)+'}{2} = '+v:'%f{n(n+1)(2n+1)}{6} = %f{'+n+'×'+(n+1)+'×'+(2*n+1)+'}{6} = '+v)+'。');},
 function(){const a1=R(1,4),p=RC([2,3]),q=NZ(-3,4);
  let a=a1;const seq=[a1];for(let i=0;i<3;i++){a=p*a+q;seq.push(a);}
  return Q('a_1 = '+a1+'、a_{n+1} = '+p+'a_n '+sg(q)+' で定まる数列の a_4 は？',
   String(seq[3]),[String(seq[2]),String(seq[3]+q),String(a1*Math.pow(p,3))],
   '順に計算：a_2 = '+seq[1]+'、a_3 = '+seq[2]+'、a_4 = '+seq[3]+'。漸化式はまず書き出す。');},
 function(){return Q('数学的帰納法で命題 P(n) をすべての自然数 n について証明したい。<br>n = k で成り立つと仮定したあと、示すべきことは？',
   'n = k + 1 でも成り立つこと',['n = k − 1 でも成り立つこと','すべての n で成り立つこと','n = k で成り立つこと'],
   '帰納法は (1) n=1 で成立、(2) n=k の成立を仮定して n=k+1 の成立を導く、の2本立て。これでドミノが端から全部倒れる。');}
]});

UNITS.push({k:'B',n:'統計的な推測',s:'確率変数・二項分布・正規分布・区間推定',boss:'μ',
slides:[
 {t:'確率変数の期待値と分散',h:`
  <p>確率変数 X が値 x_i を確率 p_i でとるとき、</p>
  <div class="eq">E(X) = Σ x_i p_i<br>V(X) = E(X^2) − {E(X)}^2</div>
  <p>期待値は「長い目で見た平均」。サイコロなら 3.5 で、実際には出ない値になることもあります。</p>`},
 {t:'二項分布',h:`
  <p>確率 p のことが n 回中何回起きるか。X が二項分布 B(n, p) に従うとき、</p>
  <div class="eq">E(X) = np&nbsp;&nbsp;&nbsp;V(X) = np(1 − p)</div>
  <p>コインを 100 回投げたときの表の回数なら E = 50、V = 25、標準偏差 5。</p>`},
 {t:'正規分布と標準化',h:`
  <p>平均 m、標準偏差 σ の正規分布は、標準化すれば1つの表で扱えます。</p>
  <div class="eq">Z = %f{X − m}{σ}</div>
  <p>「平均から標準偏差いくつ分ずれているか」に直す作業です。</p>`,fig:'normal'},
 {t:'標本平均と区間推定',h:`
  <p>大きさ n の標本の平均は、母平均 m のまわりに散らばります。その散らばりは、</p>
  <div class="eq">標本平均の標準偏差 = %f{σ}{%s{n}}</div>
  <p>n を 4 倍にすると散らばりは半分。ここから 95% 信頼区間が作れます。</p>
  <div class="eq">m ± 1.96 × %f{σ}{%s{n}}</div>`}
],
gens:[
 function(){const T=[[[0,1,2],[0.5,0.3,0.2]],[[1,2,3],[0.2,0.5,0.3]],[[0,10,20],[0.6,0.3,0.1]],[[1,3,5],[0.4,0.4,0.2]]];
  const t=RC(T);const E=t[0].reduce((s,v,i)=>s+v*t[1][i],0);
  return Q('確率変数 X が次の分布に従うとき、期待値 E(X) は？<div class="eq">X : '+t[0].join(', ')+'<br>P : '+t[1].join(', ')+'</div>',
   String(Math.round(E*100)/100),[String(t[0][2]),String(Math.round(E*200)/100),String(t[0].reduce((s,v)=>s+v,0))],
   'E(X) = '+t[0].map((v,i)=>v+'×'+t[1][i]).join(' + ')+' = '+Math.round(E*100)/100+'。値と確率をかけて全部足す。');},
 function(){const n=RC([50,100,200,400]),p=RC([0.5,0.2,0.1,0.25]);
  const which=RC(['平均','分散']);
  const v=which==='平均'?n*p:n*p*(1-p);
  return Q('X が二項分布 B('+n+', '+p+') に従うとき、X の'+which+'は？',
   String(Math.round(v*100)/100),[String(n*p*(which==='平均'?(1-p):1)),String(n),String(Math.round(Math.sqrt(n*p*(1-p))*100)/100)],
   which==='平均'?'E(X) = np = '+n+'×'+p+' = '+n*p+'。':'V(X) = np(1−p) = '+n+'×'+p+'×'+(1-p)+' = '+Math.round(v*100)/100+'。');},
 function(){const m=RC([50,60,70,100]),s=RC([5,10,20]),x=m+s*RC([1,2,-1,-2]);
  const z=(x-m)/s;
  return Q('平均 '+m+'、標準偏差 '+s+' の正規分布に従う X が '+x+' のとき、標準化した値 Z は？',
   num(z),[num(-z),num(x-m),num(Math.round(x/s*100)/100)],
   'Z = %f{X − m}{σ} = %f{'+x+' − '+m+'}{'+s+'} = '+num(z)+'。「平均から標準偏差何個ぶん離れているか」を表す。');},
 function(){const s=RC([10,20,30,60]),n=RC([4,9,16,25,100]);
  const v=s/Math.sqrt(n);
  return Q('母標準偏差が '+s+' の母集団から大きさ '+n+' の標本を取る。標本平均の標準偏差は？',
   String(Math.round(v*100)/100),[String(s),String(s/n),String(Math.round(v*2*100)/100)],
   '%f{σ}{%s{n}} = %f{'+s+'}{'+Math.sqrt(n)+'} = '+Math.round(v*100)/100+'。標本を増やすほど平均は安定する（%s{n} に反比例）。');},
 function(){const s=RC([10,20,50]),n=RC([100,400,2500]);
  const half=Math.round(1.96*s/Math.sqrt(n)*100)/100;
  return Q('母標準偏差 '+s+'、標本の大きさ '+n+' のとき、母平均の 95% 信頼区間は「標本平均 ± ?」',
   String(half),[String(half*2),String(s/Math.sqrt(n)),String(Math.round(1.96*s*100)/100)],
   '1.96 × %f{σ}{%s{n}} = 1.96 × %f{'+s+'}{'+Math.sqrt(n)+'} = '+half+'。標本を4倍にすると幅は半分になる。');},
 function(){return Q('「95% 信頼区間」の意味として正しいのは？',
   '同じ調査を何度も行うと、作った区間の約95%が母平均を含む',
   ['母平均がこの区間に入る確率が95%である','データの95%がこの区間に入る','この区間の外に母平均がある確率が95%'],
   '母平均は動かない定数で、動くのは<b>区間の方</b>。「区間を作る手続きの信頼度が95%」という意味。よくある誤解なので入試でも問われる。');}
]});

UNITS.push({k:'B',n:'数学と社会生活',s:'複利・指数的な変化・最適化・意思決定',boss:'%',
slides:[
 {t:'数学でモデルをつくる',h:`
  <p>現実の問題を数式に置き換えることを<b>モデル化</b>といいます。値段・人数・時間などを文字で置き、関係を式にする。</p>
  <p>大事なのは「何を x とするか」。ここを決めた時点で問題の半分は解けています。</p>`},
 {t:'複利：かけ算で増える',h:`
  <p>元金 A を年利 r で n 年預けると、</p>
  <div class="eq">A(1 + r)^n</div>
  <p>足し算ではなく<b>かけ算</b>で増えるので、年数が伸びるほど差が大きく開きます。感染者数・人口・SNSの拡散も同じ形です。</p>`},
 {t:'倍になるまでの時間',h:`
  <p>(1 + r)^n = 2 を解けば「何年で2倍か」がわかります。両辺の対数をとって、</p>
  <div class="eq">n = %f{log 2}{log(1 + r)}</div>
  <p>年利 5% なら約 14 年。おおまかには <b>72 ÷ 利率(%)</b> で近似できます（72の法則）。</p>`},
 {t:'条件のもとで最大にする',h:`
  <p>「材料が限られた中で利益を最大にする」タイプの問題。制約を不等式で書き、領域を図示して、<b>頂点で最大・最小になる</b>ことを使います。</p>
  <div class="hint">領域の角（頂点）だけ調べれば十分。すべての点を試す必要はありません。</div>`}
],
gens:[
 function(){const a=RC([10,20,50,100]),r=RC([0.1,0.2,0.5]),n=R(2,3);
  const v=Math.round(a*Math.pow(1+r,n)*1000)/1000;
  return Q(a+'万円を年利 '+(r*100)+'% の複利で '+n+' 年預けると、元利合計はいくら？',
   v+'万円',[(a*(1+r*n))+'万円',(a*(1+r))+'万円',(a*Math.pow(1+r,n+1))+'万円'],
   a+' × '+(1+r)+'^'+n+' = '+v+' 万円。単利（'+(a*(1+r*n))+'万円）より増えるのが複利の特徴。');},
 function(){const t=RC([[2,10,1024],[2,8,256],[3,5,243],[2,6,64]]);
  return Q('あるバクテリアは1時間ごとに '+t[0]+' 倍に増える。'+t[1]+' 時間後には最初の何倍？',
   t[2]+'倍',[(t[0]*t[1])+'倍',(t[2]/t[0])+'倍',(t[2]*t[0])+'倍'],
   t[0]+'^'+t[1]+' = '+t[2]+' 倍。かけ算で増える＝指数関数的な増加。時間に比例するのではない。');},
 function(){const T=[
   ['x + y ≦ 6, 2x + y ≦ 8, x ≧ 0, y ≧ 0 のもとで 3x + 4y','24','(0, 6) で 3×0 + 4×6 = 24'],
   ['x + y ≦ 5, x + 3y ≦ 9, x ≧ 0, y ≧ 0 のもとで 2x + y','10','(5, 0) で 2×5 + 0 = 10'],
   ['x + 2y ≦ 8, 3x + y ≦ 9, x ≧ 0, y ≧ 0 のもとで x + y','5','(2, 3) で 2 + 3 = 5']];
  const t=RC(T);
  return Q('次の条件のもとで、式の最大値は？<div class="eq">'+t[0]+'</div>',
   t[1],[String(Number(t[1])+2),String(Number(t[1])-3),String(Number(t[1])*2)],
   '領域を図示すると多角形になり、最大値は必ず<b>頂点</b>でとる。'+t[2]+'。');},
 function(){const p=RC([0.1,0.2,0.25,0.5]),win=RC([200,500,1000]),cost=RC([50,100,150]);
  const E=Math.round((p*win-cost)*100)/100;
  return Q('1回 '+cost+'円のくじ。確率 '+p+' で '+win+'円もらえる。1回あたりの損得の期待値は？',
   (E>=0?'+':'')+E+'円',[(p*win)+'円',(win-cost)+'円',(-cost)+'円'],
   '期待値 = '+p+'×'+win+' − '+cost+' = '+E+' 円。'+(E>=0?'長い目で見れば得。':'長い目で見れば損（回数を重ねるほど確実に減る）。'));},
 function(){const r=RC([10,20,25,50]);
  const v=Math.round((1+r/100)*(1-r/100)*1000)/1000;
  return Q('ある商品の値段が '+r+'% 上がったあと、'+r+'% 下がった。元の値段と比べてどうなった？',
   '元より安い（'+v+'倍）',['元と同じ','元より高い（'+(1+r*r/10000)+'倍）','ちょうど半分'],
   '('+(1+r/100)+') × ('+(1-r/100)+') = '+v+' 倍。上げ幅の基準額と下げ幅の基準額が違うので、<b>元には戻らない</b>。');},
 function(){const n=RC([200,500,1000]),p=RC([0.4,0.6,0.3]);
  const c=Math.round(n*p);
  const se=Math.round(Math.sqrt(p*(1-p)/n)*1.96*1000)/10;
  return Q('無作為に選んだ '+n+' 人のうち '+c+' 人が賛成だった。標本比率は？',
   (p*100)+'%',[c+'%',(Math.round(p*1000)/10+10)+'%',(100-p*100)+'%'],
   '%f{'+c+'}{'+n+'} = '+p+' なので '+(p*100)+'%。ちなみに 95% 信頼区間の幅は ±約 '+se+' ポイントで、標本が大きいほど狭くなる。');}
]});

UNITS.push({k:'III',n:'極限',s:'数列の極限・関数の極限・連続性',boss:'∞',
slides:[
 {t:'数列の極限：収束か発散か',h:`
  <p>n を限りなく大きくしたとき、a_n が一定の値に近づけば<b>収束</b>、そうでなければ<b>発散</b>です。</p>
  <div class="eq">|r| &lt; 1 → r^n → 0<br>r = 1 → 1<br>r &gt; 1 → ∞<br>r ≦ −1 → 振動して発散</div>
  <p>等比数列の極限は公比 r の位置だけで決まります。ここが無限等比級数の土台になります。</p>`},
 {t:'∞/∞ 型は最高次で割る',h:`
  <p>そのまま代入すると ∞/∞ になってしまう形は、<b>分母の最高次の項で分子・分母を割る</b>。</p>
  <div class="eq">lim %f{3n^2 + 5n}{2n^2 − 1} = lim %f{3 + %f{5}{n}}{2 − %f{1}{n^2}} = %f{3}{2}</div>
  <p>%f{1}{n} → 0 を使えば、残るのは最高次の係数の比だけです。</p>`,fig:'limfig'},
 {t:'関数の極限と 0/0 型',h:`
  <p>0/0 になる形は、<b>因数分解して約分</b>するか、<b>有理化</b>して 0 を消します。</p>
  <div class="eq">lim_{x→2} %f{x^2 − 4}{x − 2} = lim (x + 2) = 4</div>
  <p>三角関数では次の公式が主役です（角はラジアン）。</p>
  <div class="eq">lim_{x→0} %f{sin x}{x} = 1</div>`},
 {t:'連続性と中間値の定理',h:`
  <p>その点で「極限値 = 関数値」なら<b>連続</b>。グラフがつながっている状態です。</p>
  <p>区間 [a, b] で連続で f(a) と f(b) の符号が違えば、その間に必ず f(x) = 0 となる x があります（<b>中間値の定理</b>）。方程式に解があることの証明に使えます。</p>`}
],
gens:[
 function(){const a=R(2,7),c=R(2,7),b=NZ(-6,6),d=NZ(-6,6);
  return Q('次の極限を求めよう。<div class="eq">lim_{n→∞} %f{'+a+'n^2 '+sg(b)+'n}{'+c+'n^2 '+sg(d)+'}</div>',
   frac(a,c),[frac(c,a),frac(b,d),'0','∞'],
   '分母・分子を n^2 で割ると %f{'+a+' + %f{'+b+'}{n}}{'+c+' + %f{'+d+'}{n^2}}。%f{1}{n} → 0 なので '+frac(a,c)+'。最高次の係数の比になる。');},
 function(){const T=[['(%f{1}{2})^n','0'],['(%f{2}{3})^n','0'],['2^n','∞'],['3^n','∞'],
   ['(−%f{1}{3})^n','0'],['(−2)^n','振動して発散する'],['1^n','1'],['(−1)^n','振動して発散する']];
  const t=RC(T);
  return Q('次の数列の n → ∞ での極限は？<div class="eq">'+t[0]+'</div>',t[1],
   ['0','∞','1','振動して発散する'].filter(v=>v!==t[1]),
   '公比 r の位置で決まる。|r| &lt; 1 なら 0、r &gt; 1 なら ∞、r ≦ −1 なら振動して発散。');},
 function(){const a=NZ(-5,5);
  return Q('次の極限を求めよう。<div class="eq">lim_{x→'+num(a)+'} %f{x^2 − '+(a*a)+'}{x '+sg(-a)+'}</div>',
   num(2*a),[num(a),'0',num(a*a),num(4*a)],
   '分子を因数分解すると (x '+sg(-a)+')(x '+sg(a)+')。約分して x '+sg(a)+' となり、x → '+num(a)+' を代入して '+num(2*a)+'。');},
 function(){const k=R(2,7);
  return Q('次の極限を求めよう。<div class="eq">lim_{x→0} %f{sin '+k+'x}{x}</div>',
   String(k),['1','0',String(k*k),frac(1,k)],
   '%f{sin '+k+'x}{x} = '+k+' × %f{sin '+k+'x}{'+k+'x}。lim %f{sin θ}{θ} = 1 なので答えは '+k+'。中身と分母をそろえるのがコツ。');},
 function(){const a=R(2,6);
  return Q('次の極限を求めよう。<div class="eq">lim_{x→0} %f{%s{x + '+(a*a)+'} − '+a+'}{x}</div>',
   frac(1,2*a),[frac(1,a),'0',frac(a,2),frac(2,a)],
   '分子を有理化する。(%s{x+'+(a*a)+'} − '+a+')(%s{x+'+(a*a)+'} + '+a+') = x なので、式は %f{1}{%s{x+'+(a*a)+'} + '+a+'} となり、x → 0 で '+frac(1,2*a)+'。');},
 function(){const k=RC([2,3,4,5]),a=R(1,6)*(k-1);
  const S=a*k/(k-1);
  return Q('初項 '+a+'、公比 %f{1}{'+k+'} の無限等比級数の和は？',
   (Number.isInteger(S)?String(S):frac(a*k,k-1)),[String(a*k),frac(a,k-1),String(a)],
   '|r| &lt; 1 なので収束する。和 = %f{a}{1 − r} = %f{'+a+'}{1 − %f{1}{'+k+'}} = '+(Number.isInteger(S)?S:frac(a*k,k-1))+'。');}
]});

UNITS.push({k:'III',n:'微分法',s:'積・商・合成関数・三角/指数/対数の微分',boss:'d',
slides:[
 {t:'まず基本の導関数',h:`
  <div class="eq">(x^n)' = n x^{n−1}&nbsp;&nbsp;&nbsp;(e^x)' = e^x<br>
  (log x)' = %f{1}{x}&nbsp;&nbsp;&nbsp;(tan x)' = %f{1}{cos^2 x}<br>
  (sin x)' = cos x&nbsp;&nbsp;&nbsp;(cos x)' = −sin x</div>
  <p>e^x は<b>微分しても変わらない</b>唯一の関数。cos の微分にマイナスがつくところが唯一の落とし穴です。</p>`},
 {t:'積の微分・商の微分',h:`
  <div class="eq">(fg)' = f'g + fg'<br>(%f{f}{g})' = %f{f'g − fg'}{g^2}</div>
  <p>積は「<b>前を微分 + 後ろを微分</b>」。商は分子の順番が命で、<b>引き算の順を逆にすると符号がすべて狂います</b>。</p>
  <div class="eq">(x sin x)' = sin x + x cos x</div>`},
 {t:'合成関数の微分（チェーンルール）',h:`
  <p>「外側を微分 × 中身を微分」。中身の微分を掛け忘れるのが最頻出ミスです。</p>
  <div class="eq">{f(g(x))}' = f'(g(x)) · g'(x)</div>
  <div class="eq">(sin 3x)' = 3cos 3x&nbsp;&nbsp;(e^{2x})' = 2e^{2x}<br>{(x^2+1)^5}' = 5(x^2+1)^4 · 2x</div>`},
 {t:'対数微分法と逆関数',h:`
  <p>log|x| の微分は %f{1}{x}。中身が関数なら合成関数の形になります。</p>
  <div class="eq">{log(ax + b)}' = %f{a}{ax + b}</div>
  <p>x^x のように指数に文字がある式は、両辺の対数をとってから微分します（対数微分法）。逆関数の微分は %f{dy}{dx} = %f{1}{%f{dx}{dy}}。</p>`}
],
gens:[
 function(){const T=[['sin x','cos x'],['cos x','−sin x'],['tan x','%f{1}{cos^2 x}'],['e^x','e^x'],
   ['log x','%f{1}{x}'],['%f{1}{x}','−%f{1}{x^2}']];
  const t=RC(T);
  return Q('次の関数を微分しよう。<div class="eq">y = '+t[0]+'</div>',t[1],
   T.map(v=>v[1]).filter(v=>v!==t[1]),
   '基本公式そのまま。'+(t[0]==='cos x'?'cos の微分には<b>マイナス</b>がつく。':t[0]==='e^x'?'e^x は微分しても形が変わらない。':'覚えるしかない基本形。'));},
 function(){const T=[['x sin x','sin x + x cos x'],['x cos x','cos x − x sin x'],
   ['x e^x','(x + 1)e^x'],['x log x','log x + 1']];
  const t=RC(T);
  return Q('積の微分を使おう。<div class="eq">y = '+t[0]+'</div>',t[1],
   T.map(v=>v[1]).filter(v=>v!==t[1]),
   "(fg)' = f'g + fg' に当てはめる。前を微分したもの × 後ろ ＋ 前 × 後ろを微分したもの。");},
 function(){const a=R(2,6),T=RC(['sin','cos','e']);
  const c=T==='sin'?a+'cos '+a+'x':(T==='cos'?'−'+a+'sin '+a+'x':a+'e^{'+a+'x}');
  const w=T==='sin'?['cos '+a+'x','−'+a+'cos '+a+'x',a+'sin '+a+'x']
    :(T==='cos'?['−sin '+a+'x',a+'sin '+a+'x','−'+a+'cos '+a+'x']
    :['e^{'+a+'x}',a+'x e^{'+a+'x}','%f{1}{'+a+'}e^{'+a+'x}']);
  return Q('合成関数の微分を使おう。<div class="eq">y = '+(T==='e'?'e^{'+a+'x}':T+' '+a+'x')+'</div>',c,w,
   '外側を微分してから<b>中身の微分 '+a+'</b> を掛ける。掛け忘れが最頻出ミス。答えは '+c+'。');},
 function(){const n=R(2,5),k=R(2,5);
  return Q('合成関数の微分を使おう。<div class="eq">y = (x^2 + '+k+')^'+n+'</div>',
   String(2*n)+'x(x^2 + '+k+')^'+(n-1),
   [String(n)+'(x^2 + '+k+')^'+(n-1),String(2*n)+'x(x^2 + '+k+')^'+n,String(n)+'x(x^2 + '+k+')^'+(n-1)],
   '外側の微分 '+n+'(x^2+'+k+')^'+(n-1)+' に、中身の微分 2x を掛けて '+(2*n)+'x(x^2+'+k+')^'+(n-1)+'。');},
 function(){const a=R(2,6),b=NZ(-5,5);
  return Q('次の関数を微分しよう。<div class="eq">y = log('+a+'x '+sg(b)+')</div>',
   '%f{'+a+'}{'+a+'x '+sg(b)+'}',['%f{1}{'+a+'x '+sg(b)+'}','%f{'+a+'x '+sg(b)+'}{'+a+'}','%f{1}{'+a+'}'],
   '(log u)\' = %f{u\'}{u}。u = '+a+'x '+sg(b)+' で u\' = '+a+' なので %f{'+a+'}{'+a+'x '+sg(b)+'}。');},
 function(){const T=[['%f{x}{x + 1}','%f{1}{(x + 1)^2}'],['%f{1}{x + 1}','−%f{1}{(x + 1)^2}'],
   ['%f{x}{x − 1}','−%f{1}{(x − 1)^2}'],['%f{x + 1}{x}','−%f{1}{x^2}']];
  const t=RC(T);

   T.map(v=>v[1]).filter(v=>v!==t[1]),

UNITS.push({k:'III',n:'微分法の応用',s:'接線・増減・凹凸と変曲点・グラフの概形',boss:'∩',
slides:[
 {t:'接線の方程式',h:`
  <p>曲線 y = f(x) 上の点 (a, f(a)) における接線は、</p>
  <div class="eq">y − f(a) = f'(a)(x − a)</div>
  <p>「傾き f'(a)、通る点 (a, f(a))」を代入するだけ。法線は傾きが −%f{1}{f'(a)} になります。</p>`},
 {t:'第2次導関数と凹凸',h:`
  <p>f'(x) は<b>増減</b>を、f''(x) は<b>曲がり方</b>を教えてくれます。</p>
  <div class="eq">f''(x) &gt; 0 → 下に凸（∪）<br>f''(x) &lt; 0 → 上に凸（∩）</div>
  <p>f''(x) の符号が変わる点が<b>変曲点</b>。カーブの向きが切り替わる場所です。</p>`,fig:'inflect'},
 {t:'グラフの概形を描く手順',h:`
  <p>順番を決めておくと迷いません。</p>

],
gens:[
 function(){const a=RC([-6,-3,3,6,9,-9]),b=NZ(-5,5);

   "f'(x) = 3x^2 "+sg(2*a)+"x "+sg(b)+"、f''(x) = 6x "+sg(2*a)+"。f''(x) = 0 より x = "+frac(-a,3)+"。ここで符号が変わるので変曲点。");},
 function(){const T=[["f''(x) &gt; 0 の区間でグラフは？",'下に凸（∪の形）'],

  const t=RC(T);

 function(){const T=[['y = %f{log x}{x}','x = e'],['y = x e^{−x}','x = 1'],['y = %f{x}{e^x}','x = 1']];

UNITS.push({k:'III',n:'積分法',s:'基本の積分・置換積分・部分積分',boss:'∮',
slides:[
 {t:'まず基本の不定積分',h:`

  <p>微分の逆をたどるだけ。sin の積分に<b>マイナス</b>がつくところが引っかけどころです。</p>`},
 {t:'1次式の中身なら「÷ 係数」',h:`
  <div class="eq">∫e^{ax} dx = %f{1}{a}e^{ax} + C<br>∫sin ax dx = −%f{1}{a}cos ax + C</div>
  <p>微分すると中身の a が前に出てくるので、あらかじめ %f{1}{a} を掛けて打ち消しておきます。中身が1次式のときだけ使える便利技です。</p>`},
 {t:'置換積分',h:`
  <p>式の中に「<b>ある関数とその微分</b>」が同居していたら置換のサイン。</p>

  <div class="hint">定積分で置換したら、<b>積分区間も u の値に書き換える</b>のを忘れずに。</div>`},
 {t:'部分積分',h:`
  <div class="eq">∫f g' dx = f g − ∫f' g dx</div>

gens:[

UNITS.push({k:'III',n:'積分法の応用',s:'面積・回転体の体積・曲線の長さ・道のり',boss:'V',

 {t:'面積は「上 − 下」',h:`
  <div class="eq">S = ∫_a^b {f(x) − g(x)} dx</div>

 {t:'回転体の体積',h:`
  <p>x 軸のまわりに1回転させた立体は、薄い円板（半径 y）を積み重ねたもの。</p>
  <div class="eq">V = π∫_a^b y^2 dx</div>

],
gens:[
 function(){const a=R(1,5);

UNITS.push({k:'C',n:'ベクトル',s:'成分・内積・位置ベクトル・空間ベクトル',boss:'↗',
slides:[
 {t:'ベクトルは「向きと大きさ」',h:`
  <p>位置は関係なく、<b>向きと長さが同じなら同じベクトル</b>。成分で表すと計算は数の足し算に変わります。</p>
  <div class="eq">a = (a_1, a_2), b = (b_1, b_2)<br>a + b = (a_1 + b_1, a_2 + b_2)<br>ka = (ka_1, ka_2)</div>
  <div class="eq">|a| = %s{a_1^2 + a_2^2}</div>`},
 {t:'内積は「射影 × 長さ」',h:`
  <div class="eq">a·b = |a||b|cosθ = a_1b_1 + a_2b_2</div>
  <p>定義は2通りありますが同じもの。<b>角度を知りたいときは左の式、成分があるときは右の式</b>を使います。</p>
  <div class="eq">a ⊥ b ⇔ a·b = 0</div>
  <p>垂直条件が「かけて足したら 0」という計算だけで判定できるのが内積の強みです。</p>`,fig:'vecfig'},
 {t:'位置ベクトルと分点',h:`
  <p>点 A, B の位置ベクトルを a, b とすると、線分 AB を m : n に内分する点 P は、</p>
  <div class="eq">p = %f{n a + m b}{m + n}</div>
  <p>3点 A, B, C が一直線上にある条件は、AC = k AB となる実数 k があること。図形の問題が計算に化けます。</p>`},
 {t:'空間ベクトル',h:`
  <p>成分が1つ増えるだけで、規則は平面とまったく同じです。</p>
  <div class="eq">|a| = %s{a_1^2 + a_2^2 + a_3^2}<br>a·b = a_1b_1 + a_2b_2 + a_3b_3</div>
  <p>同一平面上にある条件や、球面の方程式など、空間図形の問題を成分計算に落とし込めます。</p>`}
],
gens:[
 function(){const a1=NZ(-5,5),a2=NZ(-5,5),b1=NZ(-5,5),b2=NZ(-5,5),k=R(2,3);
  return Q('a = ('+num(a1)+', '+num(a2)+'), b = ('+num(b1)+', '+num(b2)+') のとき '+k+'a − b は？',
   '('+num(k*a1-b1)+', '+num(k*a2-b2)+')',
   ['('+num(k*a1+b1)+', '+num(k*a2+b2)+')','('+num(a1-b1)+', '+num(a2-b2)+')','('+num(k*(a1-b1))+', '+num(k*(a2-b2))+')'],
   '成分ごとに計算する。'+k+'×'+num(a1)+' − ('+num(b1)+') = '+num(k*a1-b1)+'、'+k+'×'+num(a2)+' − ('+num(b2)+') = '+num(k*a2-b2)+'。');},
 function(){const a1=NZ(-5,5),a2=NZ(-5,5),b1=NZ(-5,5),b2=NZ(-5,5);
  const d=a1*b1+a2*b2;
  return Q('a = ('+num(a1)+', '+num(a2)+'), b = ('+num(b1)+', '+num(b2)+') の内積 a·b は？',
   num(d),[num(-d),num(a1*b2+a2*b1),num(a1*b1-a2*b2)],
   'a·b = a_1b_1 + a_2b_2 = ('+num(a1)+')('+num(b1)+') + ('+num(a2)+')('+num(b2)+') = '+num(d)+'。内積の答えは<b>ベクトルではなく数</b>。');},
 function(){const t=RC([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]]);
  const s1=RC([1,-1]),s2=RC([1,-1]);
  return Q('a = ('+num(s1*t[0])+', '+num(s2*t[1])+') の大きさ |a| は？',
   String(t[2]),[String(t[0]+t[1]),String(t[2]*2),String(t[0]*t[1])],
   '|a| = %s{('+num(s1*t[0])+')^2 + ('+num(s2*t[1])+')^2} = %s{'+(t[0]*t[0]+t[1]*t[1])+'} = '+t[2]+'。符号は2乗で消える。');},
 function(){const a1=R(2,6),a2=NZ(-6,6),b2=NZ(-6,6);
  const k=-a2*b2/a1;
  const ok=Number.isInteger(k);
  const kk=ok?k:frac(-a2*b2,a1);
  return Q('a = ('+a1+', '+num(a2)+') と b = (k, '+num(b2)+') が垂直になるような k は？',
   String(kk),[String(ok?-k:frac(a2*b2,a1)),num(a2*b2),String(0)],
   '垂直 ⇔ 内積 0。'+a1+'k + ('+num(a2)+')('+num(b2)+') = 0 より '+a1+'k = '+num(-a2*b2)+'、k = '+kk+'。');},
 function(){const m=R(1,4);let n=R(1,4);while(n===m)n=R(1,4);
  return Q('線分 AB を '+m+' : '+n+' に内分する点 P の位置ベクトル p は？（A, B の位置ベクトルを a, b とする）',
   '%f{'+n+'a + '+m+'b}{'+(m+n)+'}',
   ['%f{'+m+'a + '+n+'b}{'+(m+n)+'}','%f{'+n+'a − '+m+'b}{'+(m+n)+'}','%f{a + b}{'+(m+n)+'}'],
   '内分点は p = %f{n a + m b}{m + n}。<b>m と n がたすきがけ</b>になる（B 側の比 '+m+' が b にかかる）。');},
 function(){const t=RC([[1,2,2,3],[2,3,6,7],[1,4,8,9],[2,6,9,11],[4,4,7,9]]);
  return Q('空間ベクトル a = ('+t[0]+', '+t[1]+', '+t[2]+') の大きさは？',
   String(t[3]),[String(t[0]+t[1]+t[2]),String(t[3]*2),String(t[0]*t[1])],
   '|a| = %s{'+t[0]+'^2 + '+t[1]+'^2 + '+t[2]+'^2} = %s{'+(t[0]*t[0]+t[1]*t[1]+t[2]*t[2])+'} = '+t[3]+'。成分が増えても規則は同じ。');}
]});

UNITS.push({k:'C',n:'平面上の曲線',s:'放物線・楕円・双曲線・極座標',boss:'⊂',
slides:[
 {t:'2次曲線は「距離の条件」で決まる',h:`
  <p><b>放物線</b>：焦点と準線から等距離。y^2 = 4px の焦点は (p, 0)、準線は x = −p。</p>
  <p><b>楕円</b>：2つの焦点からの距離の<b>和</b>が一定。</p>
  <p><b>双曲線</b>：2つの焦点からの距離の<b>差</b>が一定。</p>`},
 {t:'楕円',h:`
  <div class="eq">%f{x^2}{a^2} + %f{y^2}{b^2} = 1&nbsp;(a &gt; b &gt; 0)</div>
  <p>長軸の長さは 2a、短軸は 2b。焦点は (±c, 0) で <b>c = %s{a^2 − b^2}</b>。距離の和は 2a です。</p>`,fig:'ellipse'},
 {t:'双曲線',h:`
  <div class="eq">%f{x^2}{a^2} − %f{y^2}{b^2} = 1</div>
  <p>焦点は (±c, 0) で <b>c = %s{a^2 + b^2}</b>（楕円は引き算、双曲線は足し算）。漸近線は次の2本です。</p>
  <div class="eq">y = ±%f{b}{a}x</div>
  <div class="hint">漸近線は、右辺の 1 を 0 に置きかえて因数分解すると出てきます。</div>`},
 {t:'極座標',h:`
  <p>点を「原点からの距離 r」と「x 軸からの角 θ」で表す方法。</p>
  <div class="eq">x = r cosθ,&nbsp; y = r sinθ<br>r = %s{x^2 + y^2},&nbsp; tanθ = %f{y}{x}</div>
  <p>円や螺旋など、原点を中心とする形は極座標のほうが式が簡単になります。</p>`}
],
gens:[
 function(){const t=RC([[5,4,3],[5,3,4],[13,12,5],[10,8,6],[17,15,8]]);
  return Q('楕円 %f{x^2}{'+(t[0]*t[0])+'} + %f{y^2}{'+(t[1]*t[1])+'} = 1 の焦点の座標は？',
   '(±'+t[2]+', 0)',['(0, ±'+t[2]+')','(±'+t[0]+', 0)','(±'+(t[0]-t[1])+', 0)'],
   'a = '+t[0]+', b = '+t[1]+' で c = %s{a^2 − b^2} = %s{'+(t[0]*t[0]-t[1]*t[1])+'} = '+t[2]+'。x^2 の分母が大きいので焦点は x 軸上。');},
 function(){const a=R(3,9),b=R(2,a-1);
  return Q('楕円 %f{x^2}{'+(a*a)+'} + %f{y^2}{'+(b*b)+'} = 1 上の点から2つの焦点までの距離の和は？',
   String(2*a),[String(2*b),String(a),String(a*a)],
   '距離の和は長軸の長さ 2a に等しい。a = '+a+' なので '+(2*a)+'。楕円の定義そのもの。');},
 function(){const P=RC([[2,3],[3,2],[3,4],[4,3],[2,5],[5,2],[3,5],[4,5],[5,4],[5,3]]),a=P[0],b=P[1];
  return Q('双曲線 %f{x^2}{'+(a*a)+'} − %f{y^2}{'+(b*b)+'} = 1 の漸近線は？',
   'y = ±%f{'+b+'}{'+a+'}x',['y = ±%f{'+a+'}{'+b+'}x','y = ±'+(a*b)+'x','y = ±%f{'+(b*b)+'}{'+(a*a)+'}x'],
   '右辺を 0 とおくと %f{x^2}{'+(a*a)+'} = %f{y^2}{'+(b*b)+'}、つまり y = ±%f{b}{a}x = ±%f{'+b+'}{'+a+'}x。');},
 function(){const p=R(1,5);
  return Q('放物線 y^2 = '+(4*p)+'x の焦点の座標は？',
   '('+p+', 0)',['(0, '+p+')','('+(4*p)+', 0)','(−'+p+', 0)'],
   'y^2 = 4px の形なので 4p = '+(4*p)+' より p = '+p+'。焦点は (p, 0) = ('+p+', 0)、準線は x = −'+p+'。');},
 function(){const T=[[2,'%f{π}{3}','(1, %s{3})'],[2,'%f{π}{6}','(%s{3}, 1)'],[2,'%f{π}{4}','(%s{2}, %s{2})'],
   [4,'%f{π}{3}','(2, 2%s{3})'],[2,'%f{π}{2}','(0, 2)']];
  const t=RC(T);
  return Q('極座標 (r, θ) = ('+t[0]+', '+t[1]+') を直交座標で表すと？',t[2],
   T.map(v=>v[2]).filter(v=>v!==t[2]),
   'x = r cosθ = '+t[0]+'cos'+t[1]+'、y = r sinθ = '+t[0]+'sin'+t[1]+' を計算して '+t[2]+'。');},
 function(){const T=[['(1, 1)','(%s{2}, %f{π}{4})'],['(−1, 1)','(%s{2}, %f{3π}{4})'],
   ['(%s{3}, 1)','(2, %f{π}{6})'],['(0, 2)','(2, %f{π}{2})']];
  const t=RC(T);
  return Q('直交座標 '+t[0]+' を極座標 (r, θ) で表すと？（0 ≦ θ &lt; 2π）',t[1],
   T.map(v=>v[1]).filter(v=>v!==t[1]),
   'r = %s{x^2 + y^2} で距離を、tanθ = %f{y}{x} と<b>点のある象限</b>から角を決める。答えは '+t[1]+'。');}
]});

UNITS.push({k:'C',n:'複素数平面',s:'絶対値・極形式・ド・モアブルの定理',boss:'z',
slides:[
 {t:'複素数を平面の点として見る',h:`
  <p>z = a + bi を点 (a, b) と対応させたものが複素数平面。実軸と虚軸でできています。</p>
  <div class="eq">|z| = %s{a^2 + b^2}&nbsp;&nbsp; z̄ = a − bi<br>|z|^2 = z z̄</div>
  <p>|z| は原点からの距離、|α − β| は2点間の距離を表します。</p>`,fig:'cplane'},
 {t:'極形式',h:`
  <div class="eq">z = r(cosθ + i sinθ)&nbsp;&nbsp;(r = |z|)</div>
  <p>この形にすると、かけ算・わり算がとても簡単になります。</p>
  <div class="eq">積：絶対値はかける、偏角は<b>たす</b><br>商：絶対値はわる、偏角は<b>ひく</b></div>
  <p>つまり複素数を掛けることは「<b>拡大 + 回転</b>」。i を掛けると 90° 回転します。</p>`},
 {t:'ド・モアブルの定理',h:`
  <div class="eq">{r(cosθ + i sinθ)}^n = r^n(cos nθ + i sin nθ)</div>
  <p>累乗が「<b>絶対値は n 乗、偏角は n 倍</b>」だけで計算できます。(1 + i)^{10} のような計算も、極形式に直せば一瞬です。</p>`},
 {t:'n乗根と正多角形',h:`
  <p>z^n = 1 の解は n 個あり、単位円周上に<b>正 n 角形</b>の頂点として並びます。</p>
  <div class="eq">z = cos%f{2kπ}{n} + i sin%f{2kπ}{n}<br>(k = 0, 1, …, n−1)</div>
  <p>代数の問題が、いきなり幾何の絵になる場面です。</p>`}
],
gens:[
 function(){const t=RC([[3,4,5],[5,12,13],[8,15,17],[6,8,10],[7,24,25]]),s1=RC([1,-1]),s2=RC([1,-1]);
  return Q('次の複素数の絶対値は？<div class="eq">z = '+num(s1*t[0])+(s2>0?' + ':' − ')+t[1]+'i</div>',
   String(t[2]),[String(t[0]+t[1]),String(t[2]*2),String(t[0]*t[1])],
   '|z| = %s{('+num(s1*t[0])+')^2 + ('+num(s2*t[1])+')^2} = %s{'+(t[0]*t[0]+t[1]*t[1])+'} = '+t[2]+'。');},
 function(){const T=[['1 + i','%s{2}(cos%f{π}{4} + i sin%f{π}{4})'],
   ['1 + %s{3}i','2(cos%f{π}{3} + i sin%f{π}{3})'],
   ['%s{3} + i','2(cos%f{π}{6} + i sin%f{π}{6})'],
   ['−1 + i','%s{2}(cos%f{3π}{4} + i sin%f{3π}{4})']];
  const t=RC(T);
  return Q('次の複素数を極形式で表すと？<div class="eq">z = '+t[0]+'</div>',t[1],
   T.map(v=>v[1]).filter(v=>v!==t[1]),
   'r = |z| を求め、複素数平面上で点の位置から偏角 θ を読む。答えは '+t[1]+'。');},
 function(){const T=[[6,'%f{π}{6}','−1'],[3,'%f{π}{6}','i'],[12,'%f{π}{6}','1'],
   [4,'%f{π}{4}','−1'],[2,'%f{π}{4}','i'],[8,'%f{π}{4}','1'],[3,'%f{π}{3}','−1'],[6,'%f{π}{3}','1']];
  const t=RC(T);
  return Q('ド・モアブルの定理を使おう。<div class="eq">(cos'+t[1]+' + i sin'+t[1]+')^'+t[0]+'</div>',
   t[2],['1','−1','i','−i'].filter(v=>v!==t[2]),
   '偏角を '+t[0]+' 倍すると '+t[0]+'×'+t[1]+' になる。その角の cos と sin を求めて '+t[2]+'。絶対値は 1 のままなので変わらない。');},
 function(){const r1=R(2,6),r2=R(2,6);
  return Q('|z_1| = '+r1+', |z_2| = '+r2+' のとき |z_1 z_2| は？',
   String(r1*r2),[String(r1+r2),String(r1/r2),String(r1*r2*2)],
   '積の絶対値は絶対値の積：|z_1 z_2| = |z_1||z_2| = '+r1+'×'+r2+' = '+(r1*r2)+'。偏角のほうは<b>足し算</b>になる。');},
 function(){const a=NZ(-6,6),b=NZ(-6,6);
  const f=(x,y)=>num(x)+(y<0?' − ':' + ')+Math.abs(y)+'i';
  return Q('z = '+f(a,b)+' の共役複素数 z̄ は？',f(a,-b),[f(-a,b),f(-a,-b),f(b,a)],
   '共役複素数は<b>虚部の符号だけ</b>を変える。'+f(a,-b)+'。複素数平面では実軸に関する対称移動にあたる。');},
 function(){const n=RC([3,4,6]);
  return Q('方程式 z^'+n+' = 1 の解は複素数平面上でどう並ぶ？',
   '単位円に内接する正'+n+'角形の頂点',
   ['実軸上に'+n+'個','原点を中心とする半径 '+n+' の円周上','虚軸上に'+n+'個'],
   '解は '+n+' 個あり、絶対値はすべて 1、偏角は %f{2π}{'+n+'} ずつ増える。だから単位円周上に等間隔＝正'+n+'角形の頂点に並ぶ。');}
]});

UNITS.push({k:'C',n:'数学的な表現の工夫',s:'行列の初歩・グラフ（ネットワーク）表現',boss:'M',
slides:[
 {t:'行列は「数の長方形の表」',h:`
  <p>数を縦横に並べたものが行列。同じ大きさどうしなら、和も実数倍も<b>成分ごと</b>に計算します。</p>
  <div class="eq">( a&nbsp; b )&nbsp;&nbsp;+&nbsp;&nbsp;( e&nbsp; f )&nbsp;&nbsp;=&nbsp;&nbsp;( a+e&nbsp; b+f )<br>( c&nbsp; d )&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;( g&nbsp; h )&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;( c+g&nbsp; d+h )</div>
  <p>データを表のまま扱えるので、連立方程式や統計、コンピュータグラフィックスで活躍します。</p>`},
 {t:'行列の積は「行 × 列」',h:`
  <p>積の (i, j) 成分は、<b>左の行列の i 行</b>と<b>右の行列の j 列</b>を掛けて足したもの。</p>
  <div class="eq">(1, 1)成分 = a e + b g<br>(1, 2)成分 = a f + b h</div>
  <div class="hint">行列の積は<b>順番を変えると結果が変わります</b>（AB ≠ BA）。数のかけ算との一番大きな違い。</div>`},
 {t:'行列式と連立方程式',h:`
  <p>2×2 行列の行列式は ad − bc。これが 0 でなければ逆行列が存在し、連立方程式がただ1組の解をもちます。</p>
  <div class="eq">det = ad − bc</div>
  <p>行列式は、その行列が図形を何倍に拡大するかを表す量でもあります。0 なら図形がぺしゃんこに潰れる、という意味です。</p>`},
 {t:'グラフ（ネットワーク）で関係を描く',h:`
  <p>点（頂点）と線（辺）で「つながり」を表したものがグラフ。路線図・友人関係・回路などを同じ道具で扱えます。</p>
  <div class="eq">すべての頂点の次数の合計 = 辺の数 × 2</div>
  <p>1本の辺が両端の頂点に1ずつ数えられるからです。<b>一筆書き</b>ができるのは、次数が奇数の頂点が 0 個または 2 個のときだけ。</p>`}
],
gens:[
 function(){const a=NZ(-6,6),b=NZ(-6,6),e=NZ(-6,6),f=NZ(-6,6);
  const pos=RC([['(1, 1)',a,e],['(1, 2)',b,f]]);
  return Q('次の2つの行列の和の '+pos[0]+' 成分は？<div class="eq">( '+num(a)+'&nbsp; '+num(b)+' ) と ( '+num(e)+'&nbsp; '+num(f)+' )<br>( … ) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;( … )</div>',
   num(pos[1]+pos[2]),[num(pos[1]-pos[2]),num(pos[1]*pos[2]),num(pos[2]-pos[1])],
   '和は成分ごとに足すだけ。'+num(pos[1])+' + ('+num(pos[2])+') = '+num(pos[1]+pos[2])+'。');},
 function(){const a=NZ(-5,5),b=NZ(-5,5),e=NZ(-5,5),g=NZ(-5,5);
  return Q('行列の積 AB の (1, 1) 成分は？<div class="eq">A の第1行 = ( '+num(a)+'&nbsp; '+num(b)+' )<br>B の第1列 = ( '+num(e)+',&nbsp; '+num(g)+' )</div>',
   num(a*e+b*g),[num(a*e-b*g),num(a*e),num((a+b)*(e+g))],
   '左の<b>行</b>と右の<b>列</b>を順にかけて足す：('+num(a)+')('+num(e)+') + ('+num(b)+')('+num(g)+') = '+num(a*e+b*g)+'。');},
 function(){const a=NZ(-6,6),b=NZ(-6,6),c=NZ(-6,6),d=NZ(-6,6);
  return Q('行列 ( '+num(a)+'&nbsp; '+num(b)+' ; '+num(c)+'&nbsp; '+num(d)+' ) の行列式 ad − bc は？',
   num(a*d-b*c),[num(a*d+b*c),num(a*c-b*d),num(a*b-c*d)],
   'ad − bc = ('+num(a)+')('+num(d)+') − ('+num(b)+')('+num(c)+') = '+num(a*d-b*c)+'。'+
   (a*d-b*c===0?'0 なので逆行列は存在しない。':'0 でないので逆行列が存在し、連立方程式はただ1組の解をもつ。'));},
 function(){const e=R(5,15);
  return Q('あるグラフの辺の数が '+e+' 本のとき、すべての頂点の次数の合計は？',
   String(2*e),[String(e),String(e*e),String(e+2)],
   '1本の辺は両端の頂点で1ずつ数えられるので、次数の合計は必ず辺の数の2倍。'+e+'×2 = '+(2*e)+'（必ず偶数になる）。');},
 function(){const odd=RC([0,2,4]);
  const ans=odd<=2?'一筆書きできる':'一筆書きできない';
  return Q('連結なグラフで、次数が奇数の頂点がちょうど '+odd+' 個ある。一筆書きは？',
   ans,['一筆書きできる','一筆書きできない','頂点の数によって決まる','辺の数が偶数ならできる'].filter(v=>v!==ans),
   '奇数次数の頂点が 0 個なら、どこから出発しても元の点に戻ってこられる。2個なら、その2点を出発点と終点にすればよい。4個以上は不可能。今回は '+odd+' 個なので'+ans+'。');},
 function(){const k=R(2,5),a=NZ(-6,6);
  return Q('行列の実数倍：'+k+' × ( '+num(a)+'&nbsp; … ) の (1, 1) 成分は？',
   num(k*a),[num(a+k),num(a),num(k*a*2)],
   '実数倍はすべての成分を '+k+' 倍する。'+k+' × ('+num(a)+') = '+num(k*a)+'。');}
]});

/* =========================================================
   ゲームエンジン
   ========================================================= */
UNITS.forEach((u,i)=>{u.id=i;u.col=CO[u.k];});
const scr=$('#scr');
function setAcc(k){document.documentElement.style.setProperty('--acc',CO[k]||'#4FC3F7');}
function hdr(title,back){$('#hdtitle').textContent=title;$('#back').style.display=back?'block':'none';}
$('#back').onclick=()=>{SFX.tap();(NAV.back||goHome)();};
const NAV={back:null};
let RAF=null;

/* ---------- ホーム ---------- */
function goHome(){
  if(RAF){cancelAnimationFrame(RAF);RAF=null;}
  setAcc('I');hdr('数学クエスト',false);NAV.back=null;
  const total=UNITS.reduce((s,u)=>s+(S.stars[u.id]||0),0);
  let h=`<div class="card">
    <div style="font-family:var(--serif);font-size:19px;letter-spacing:.05em;margin-bottom:6px">数式モンスターに挑む</div>
    <p style="font-size:14px;color:var(--dim)">単元を選ぶと、まず<b style="color:var(--paper)">まなび</b>で要点を確認し、そのあと<b style="color:var(--paper)">バトル</b>で8問に挑戦します。問題は毎回ランダムに作られるので、何度でも練習できます。</p>
    <div style="display:flex;gap:14px;margin-top:12px;font-family:var(--math);font-size:13px;color:var(--dim)">
      <span>★ ${total} / ${UNITS.length*3}</span><span>Lv. ${S.lv}</span><span>総XP ${S.totalXP}</span></div>
  </div>
  <button class="btn" onclick="startMix()">総復習バトル（全単元からランダム8問）</button>
  <button class="btn ghost" onclick="goStats()">学習の記録を見る</button>`;
  WORLDS.forEach(w=>{
    const us=UNITS.filter(u=>u.k===w.k);
    const got=us.reduce((s,u)=>s+(S.stars[u.id]||0),0);
    h+=`<div class="world" style="--wc:${w.col}">
      <div class="wh"><div><div class="wt">${w.name}</div><div class="ws">${w.sub}</div></div>
      <div class="wnum">★ ${got}/${us.length*3}</div></div><div class="stlist">`;
    us.forEach((u,i)=>{
      const st=S.stars[u.id]||0;
      h+=`<button class="stage" onclick="openUnit(${u.id})">
        <span class="no">${String(i+1).padStart(2,'0')}</span>
        <span class="nm">${u.n}<small>${u.s}</small></span>
        <span class="stars">${'★'.repeat(st)}<span class="off">${'★'.repeat(3-st)}</span></span></button>`;
    });
    h+='</div></div>';
  });
  scr.innerHTML=h;window.scrollTo(0,0);
}

/* ---------- 単元トップ ---------- */
function openUnit(id){
  SFX.tap();const u=UNITS[id];setAcc(u.k);hdr(u.n,true);NAV.back=goHome;
  const st=S.stat[id]||{c:0,t:0};
  scr.innerHTML=`<div class="card">
    <div style="font-family:var(--serif);font-size:24px;letter-spacing:.04em">${u.n}</div>
    <div style="font-size:13px;color:var(--dim);margin-top:4px">数学 ${u.k}　${u.s}</div>
    <div style="margin-top:14px;font-family:var(--math);font-size:13px;color:var(--dim)">
      ★ ${S.stars[id]||0}/3　これまでの正答率 ${st.t?Math.round(st.c/st.t*100):'—'}${st.t?'%':''}（${st.c}/${st.t}）</div>
  </div>
  <button class="btn pri" onclick="startLearn(${id})">まなび（要点を読む）</button>
  <button class="btn" onclick="startBattle(${id})">いきなりバトル（8問）</button>`;
  window.scrollTo(0,0);
}

/* ---------- まなび ---------- */
let LS={u:null,i:0};
function startLearn(id){SFX.tap();LS={u:UNITS[id],i:0};showSlide();}
function showSlide(){
  const u=LS.u,s=u.slides[LS.i];setAcc(u.k);
  hdr(u.n+'　まなび',true);NAV.back=()=>openUnit(u.id);
  const last=LS.i===u.slides.length-1;
  scr.innerHTML=`<div class="slide"><h3>${M(s.t)}</h3><div class="body">${M(s.h)}</div><div id="figbox"></div></div>
    <div class="dots">${u.slides.map((_,i)=>'<i class="'+(i===LS.i?'on':'')+'"></i>').join('')}</div>
    <button class="btn pri" onclick="${last?'startBattle('+u.id+')':'nextSlide()'}">${last?'バトルに進む':'次へ'}</button>
    ${LS.i>0?'<button class="btn ghost" onclick="prevSlide()">前に戻る</button>':''}`;
  if(s.fig&&FIG[s.fig])FIG[s.fig]($('#figbox'),u.col);
  window.scrollTo(0,0);
}
function nextSlide(){SFX.tap();LS.i++;showSlide();}
function prevSlide(){SFX.tap();LS.i--;showSlide();}

/* ---------- 問題生成 ---------- */
function padChoices(set,c){
  const t=String(c);
  if(/%f|%s/.test(t))return set;
  const m=t.match(/^([^0-9]*?)(−?\d+(?:\.\d+)?)([\s\S]*)$/);
  if(!m)return set;
  const pre=m[1],post=m[3],v=parseFloat(m[2].replace('−','-'));
  const cand=[v+1,v-1,v*2,-v,v+2,v-2,v*3,Math.round(v*50)/100];
  for(const x of cand){
    if(set.length>=4)break;
    if(!isFinite(x))continue;
    const q=pre+num(x)+post;
    if(set.indexOf(q)<0)set.push(q);
  }
  return set;
}
function makeQuestions(units,n){
  const out=[];let guard=0;
  const pool=[];units.forEach(u=>u.gens.forEach(g=>pool.push([u,g])));
  shuffle(pool);let idx=0;
  while(out.length<n&&guard<300){
    guard++;const[u,g]=pool[idx%pool.length];idx++;
    let q;try{q=g();}catch(e){continue;}
    if(!q||!q.c)continue;
    const set=[q.c];
    q.w.forEach(w=>{if(set.length<4&&set.indexOf(w)<0&&w!=='')set.push(w);});
    padChoices(set,q.c);
    if(set.length<3)continue;
    q.choices=shuffle(set.slice());q.ans=q.choices.indexOf(q.c);q.uid=u.id;q.uname=u.n;q.col=u.col;
    out.push(q);
  }
  return out;
}

/* ---------- バトル ---------- */
let B=null;
function startBattle(id){
  SFX.tap();ac();const u=UNITS[id];setAcc(u.k);
  B={unit:u,mix:false,qs:makeQuestions([u],8),i:0,ok:0,mhp:100,php:100,combo:0,best:0,miss:[],lock:false,t:0,tid:null};
  runQ();
}
function startMix(){
  SFX.tap();ac();setAcc('II');
  const avail=UNITS;
  B={unit:null,mix:true,qs:makeQuestions(avail,8),i:0,ok:0,mhp:100,php:100,combo:0,best:0,miss:[],lock:false,t:0,tid:null};
  runQ();
}
const LIMIT=45;
function runQ(){
  const q=B.qs[B.i];
  const name=B.mix?'総復習':B.unit.n;
  hdr(name+'　'+(B.i+1)+' / '+B.qs.length,true);
  NAV.back=()=>{stopT();if(RAF){cancelAnimationFrame(RAF);RAF=null;}B.mix?goHome():openUnit(B.unit.id);};
  const sym=B.mix?'∞':B.unit.boss;
  scr.innerHTML=`
   <div class="arena"><canvas id="mons" width="300" height="260"></canvas>
     <div class="mname">${B.mix?'総復習の化身':B.unit.n+'の主'}</div>
     <div class="hpwrap"><i id="mhp" style="width:${B.mhp}%"></i></div></div>
   <div class="mybar"><span>自分</span><div class="hpwrap"><i id="php" style="width:${B.php}%"></i></div></div>
   <div class="tbar" id="tb"><i id="tbi"></i></div>
   <div class="qmeta"><span>${q.uname}</span><span class="combo">${B.combo>1?'コンボ ×'+B.combo:''}</span></div>
   <div class="qtext">${M(q.q)}</div>
   <div id="figq"></div>
   <div id="chs">${q.choices.map((c,i)=>'<button class="choice" onclick="answer('+i+')">'+M(c)+'</button>').join('')}</div>
   <div id="after"></div>`;
  if(q.draw){try{q.draw($('#figq'));}catch(e){}}
  monsterLoop(sym,q.col||'#C77DFF');
  B.lock=false;startT();window.scrollTo(0,0);
}
function startT(){
  B.t=LIMIT;stopT();
  B.tid=setInterval(()=>{
    B.t-=0.1;const el=$('#tbi');if(!el){stopT();return;}
    el.style.width=Math.max(0,B.t/LIMIT*100)+'%';
    $('#tb').className='tbar'+(B.t<10?' warn':'');
    if(B.t<=0){stopT();if(!B.lock)answer(-1);}
  },100);
}
function stopT(){if(B&&B.tid){clearInterval(B.tid);B.tid=null;}}
let MST={sym:'∫',col:'#C77DFF',hurt:0,t:0};
function monsterLoop(sym,col){
  MST.sym=sym;MST.col=col;MST.hurt=0;
  const cv=document.getElementById('mons');if(!cv)return;
  const x=cv.getContext('2d');
  if(RAF)cancelAnimationFrame(RAF);
  const step=()=>{
    const c=document.getElementById('mons');
    if(!c){RAF=null;return;}
    MST.t+=0.05;x.clearRect(0,0,300,260);
    const bob=Math.sin(MST.t)*6, sh=MST.hurt>0?(Math.random()-.5)*14:0;
    if(MST.hurt>0)MST.hurt-=1;
    x.save();x.translate(150+sh,130+bob);
    x.globalAlpha=.20;x.fillStyle=MST.col;x.beginPath();x.ellipse(0,10,86,80,0,0,7);x.fill();
    x.globalAlpha=1;x.fillStyle=MST.hurt>0?'#FF5A5F':MST.col;
    x.font='700 108px "Times New Roman",serif';x.textAlign='center';x.textBaseline='middle';
    x.fillText(MST.sym,0,6);
    x.fillStyle='#0E1526';x.beginPath();x.arc(-24,-14,11,0,7);x.arc(24,-14,11,0,7);x.fill();
    x.fillStyle='#EAF0FF';x.beginPath();x.arc(-24+Math.sin(MST.t*.7)*3,-14,5,0,7);
    x.arc(24+Math.sin(MST.t*.7)*3,-14,5,0,7);x.fill();
    x.restore();
    RAF=requestAnimationFrame(step);
  };step();
}
function answer(i){
  if(B.lock)return;B.lock=true;stopT();
  const q=B.qs[B.i],ok=(i===q.ans);
  const btns=document.querySelectorAll('#chs .choice');
  btns.forEach((b,k)=>{b.onclick=null;
    if(k===q.ans)b.className='choice ok';
    else if(k===i)b.className='choice ng';
    else b.className='choice dim';});
  const st=S.stat[q.uid]||(S.stat[q.uid]={c:0,t:0});st.t++;
  if(ok){
    st.c++;B.ok++;B.combo++;B.best=Math.max(B.best,B.combo);
    const dmg=13+Math.min(B.combo-1,4)*2;
    B.mhp=Math.max(0,B.mhp-dmg);MST.hurt=10;SFX.ok();
    $('#mhp').style.width=B.mhp+'%';
    const mc=document.getElementById('mons');
    mc.classList.remove('pop');void mc.offsetWidth;mc.classList.add('pop');
  }else{
    B.combo=0;B.php=Math.max(0,B.php-22);SFX.ng();
    $('#php').style.width=B.php+'%';
    B.miss.push(q);
    scr.classList.add('shake');setTimeout(()=>scr.classList.remove('shake'),320);
  }
  const last=B.i===B.qs.length-1;
  $('#after').innerHTML=`
    <div class="verdict ${ok?'ok':'ng'}">${ok?'正解':(i===-1?'時間切れ':'不正解')}</div>
    ${ok?'':'<div style="font-family:var(--math);font-size:17px;margin-bottom:8px">答え： '+M(q.c)+'</div>'}
    <div class="expl">${M(q.ex)}</div>
    <button class="btn pri" onclick="${last||B.php<=0?'finish()':'nextQ()'}">${last||B.php<=0?'結果を見る':'次の問題へ'}</button>`;
  $('#after').scrollIntoView({behavior:'smooth',block:'end'});
}
function nextQ(){SFX.tap();B.i++;runQ();}

/* ---------- 結果 ---------- */
function finish(){
  stopT();if(RAF){cancelAnimationFrame(RAF);RAF=null;}
  const n=B.qs.length,ok=B.ok;
  const win=B.mhp<=0&&B.php>0;
  const stars=ok>=8?3:(ok>=6?2:(ok>=4?1:0));
  let xp=ok*12+B.best*4+(win?30:0);
  const up=addXP(xp);
  if(!B.mix){
    const u=B.unit;S.stars[u.id]=Math.max(S.stars[u.id]||0,stars);
  }
  win?SFX.win():SFX.lose();
  if(up)setTimeout(()=>{SFX.lv();toast('レベルアップ！ Lv.'+S.lv);},600);
  hdr('結果',true);NAV.back=()=>{B.mix?goHome():openUnit(B.unit.id);};
  let h=`<div class="card">
    <div class="big">${win?'撃破':'惜しい'}</div>
    <div class="bigstars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <div style="margin-top:12px">
      <div class="kv"><span>正解数</span><b>${ok} / ${n}</b></div>
      <div class="kv"><span>最大コンボ</span><b>${B.best}</b></div>
      <div class="kv"><span>獲得XP</span><b>+${xp}</b></div>
      <div class="kv" style="border:0"><span>現在</span><b>Lv.${S.lv}</b></div>
    </div></div>`;
  if(B.miss.length){
    h+='<h2 class="sec">まちがえた問題</h2><div class="card">';
    B.miss.forEach(q=>{
      h+=`<div class="rev"><div class="rq">${M(q.q).replace(/<div class="eq">/g,'<div class="eq" style="font-size:16px;padding:6px">')}</div>
        <div class="ra">答え： ${M(q.c)}</div><div class="re">${M(q.ex)}</div></div>`;
    });
    h+='</div>';
  }else{
    h+='<div class="card" style="text-align:center;font-family:var(--serif);letter-spacing:.08em">全問正解。文句なしです。</div>';
  }
  h+=`<button class="btn pri" onclick="${B.mix?'startMix()':'startBattle('+B.unit.id+')'}">もう一度バトル</button>`;
  if(!B.mix)h+=`<button class="btn" onclick="startLearn(${B.unit.id})">まなびを読み直す</button>`;
  h+=`<button class="btn ghost" onclick="goHome()">単元一覧に戻る</button>`;
  scr.innerHTML=h;window.scrollTo(0,0);
}

/* ---------- 学習の記録 ---------- */
function goStats(){
  SFX.tap();setAcc('I');hdr('学習の記録',true);NAV.back=goHome;
  const done=UNITS.filter(u=>S.stat[u.id]&&S.stat[u.id].t>0);
  let tc=0,tt=0;done.forEach(u=>{tc+=S.stat[u.id].c;tt+=S.stat[u.id].t;});
  let h=`<div class="card">
    <div class="kv"><span>レベル</span><b>${S.lv}</b></div>
    <div class="kv"><span>総獲得XP</span><b>${S.totalXP}</b></div>
    <div class="kv"><span>集めた星</span><b>${UNITS.reduce((s,u)=>s+(S.stars[u.id]||0),0)} / ${UNITS.length*3}</b></div>
    <div class="kv" style="border:0"><span>全体の正答率</span><b>${tt?Math.round(tc/tt*100)+'%':'—'}</b></div></div>`;
  if(!done.length){
    h+='<div class="card" style="color:var(--dim);font-size:14px">まだ記録がありません。どれか一つ、単元を選んでバトルしてみてください。</div>';
  }else{
    const sorted=done.slice().sort((a,b)=>(S.stat[a.id].c/S.stat[a.id].t)-(S.stat[b.id].c/S.stat[b.id].t));
    h+='<h2 class="sec">単元ごとの正答率（低い順）</h2><div class="card">';
    sorted.forEach(u=>{
      const st=S.stat[u.id],p=Math.round(st.c/st.t*100);
      h+=`<div class="srow"><div class="st"><span>数学${u.k}　${u.n}</span><span>${p}%（${st.c}/${st.t}）</span></div>
        <div class="sbar"><i style="width:${p}%;background:${u.col}"></i></div></div>`;
    });
    h+='</div>';
    const weak=sorted[0];
    h+=`<button class="btn pri" onclick="startBattle(${weak.id})">いま一番苦手な「${weak.n}」に挑む</button>`;
  }
  h+=`<div class="card" style="color:var(--dim);font-size:13px;line-height:1.7">
    記録はこの画面を開いているあいだだけ保存されます。ページを再読み込みするとリセットされます。</div>
    <button class="btn ghost" onclick="goHome()">単元一覧に戻る</button>`;
  scr.innerHTML=h;window.scrollTo(0,0);
}

document.addEventListener('touchstart',function once(){ac();document.removeEventListener('touchstart',once);},{passive:true});
paintHd();goHome();
</script>
